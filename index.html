      id: 'adm-pre-post-validation',
      title: 'Pre-Migration & Post-Migration Validation',
      content: `
<h4>What it is</h4>
<p>Validation is the proof that the migration worked. Pre-migration validation captures the "before" state. Post-migration validation proves the "after" state matches expectations. Without validation, you're guessing. With validation, you have evidence.</p>

<h4>Pre-migration validation checklist</h4>
<pre>RUN THESE BEFORE THE MIGRATION WINDOW OPENS:

IDENTITY CHECKS:
  [ ] Target domain accounts exist and are enabled
      Get-ADUser -Identity svc_appname -Server targetdc.target.local
  [ ] Target groups exist with correct membership
      Get-ADGroupMember -Identity "GRP-App-Users" -Server targetdc.target.local
  [ ] SPNs registered on target accounts
      setspn -L TARGETDOMAIN\\svc_appname
  [ ] No duplicate SPNs exist
      setspn -X    (forest-wide duplicate check)

NETWORK CHECKS:
  [ ] Server can reach target domain controllers
      Test-Connection targetdc.target.local
      Test-NetConnection targetdc.target.local -Port 389   (LDAP)
      Test-NetConnection targetdc.target.local -Port 88    (Kerberos)
  [ ] DNS resolution works for target domain
      Resolve-DnsName target.local
      Resolve-DnsName targetdc.target.local

BACKUP CHECKS:
  [ ] Full SQL backup completed and verified
      RESTORE VERIFYONLY FROM DISK = 'path\\backup.bak' WITH CHECKSUM
  [ ] System state backup completed
  [ ] Application config files backed up
      Copy-Item "C:\\App\\config" "C:\\Backups\\PreMigration\\" -Recurse
  [ ] Current service account configurations documented
      Get-WmiObject Win32_Service -ComputerName SERVER01 |
      Where { $_.StartName -like "SOURCEDOMAIN*" } |
      Export-Csv "PreMig_Services.csv" -NoTypeInformation

APPLICATION STATE CAPTURE:
  [ ] Application is currently functional (baseline test)
  [ ] Capture current performance metrics (response time, error rate)
  [ ] Document current connection count
      -- SQL: SELECT COUNT(*) FROM sys.dm_exec_connections
  [ ] Screenshot key dashboards / application state</pre>

<h4>Post-migration validation checklist</h4>
<pre>RUN THESE IMMEDIATELY AFTER MIGRATION STEPS COMPLETE:

IDENTITY VALIDATION:
  [ ] Services running under new domain account
      Get-WmiObject Win32_Service -ComputerName SERVER01 |
      Where { $_.Name -eq "AppService" } | Select Name, StartName, State
      # Expected: TARGETDOMAIN\\svc_app, Running

  [ ] Scheduled tasks running under new account
      Get-ScheduledTask -ComputerName SERVER01 |
      Where { $_.Principal.UserId -like "TARGETDOMAIN*" } |
      Select TaskName, @{N='RunAs';E={$_.Principal.UserId}}, State

  [ ] Kerberos working (not falling back to NTLM)
      # On SQL Server:
      SELECT session_id, auth_scheme, client_net_address
      FROM sys.dm_exec_connections WHERE auth_scheme = 'KERBEROS'
      # Should see KERBEROS connections

  [ ] SID History populated (if applicable)
      Get-ADUser svc_appname -Properties SIDHistory -Server targetdc.target.local |
      Select Name, SIDHistory

SQL VALIDATION:
  [ ] SQL Server service running
      Get-Service MSSQLSERVER -ComputerName SQL-SRV01
  [ ] SQL Agent running
      Get-Service SQLSERVERAGENT -ComputerName SQL-SRV01
  [ ] New logins exist and can connect
      -- Test from app server:
      sqlcmd -S SQL-SRV01 -E -Q "SELECT SUSER_NAME(), auth_scheme FROM sys.dm_exec_connections WHERE session_id = @@SPID"
  [ ] No orphaned users
      USE [AppDatabase]
      EXEC sp_change_users_login 'Report'
      # Should return 0 rows
  [ ] Database accessible and data intact
      SELECT COUNT(*) FROM [critical_table]
      # Compare with pre-migration count

APPLICATION VALIDATION:
  [ ] Application starts without errors
  [ ] Users can log in with target domain credentials
  [ ] Core functionality test:
      [ ] Read operation (view existing data)
      [ ] Write operation (create new record)
      [ ] Report generation
      [ ] Search functionality
  [ ] No errors in application logs
      Get-EventLog -ComputerName APP-SRV01 -LogName Application -After (Get-Date).AddHours(-1) -EntryType Error
  [ ] Performance acceptable (compare to pre-migration baseline)

NETWORK VALIDATION:
  [ ] DNS resolves correctly
  [ ] No firewall blocks on new paths
  [ ] Certificates valid (if using SSL/TLS with new domain names)</pre>

<h4>UAT (User Acceptance Testing)</h4>
<pre>WHO: The application owner or a designated business user
WHEN: After engineering validation passes
WHY: Engineers verify technical function. Users verify business function.

UAT TEST PLAN (template):
  Application: [Name]
  Tested by: [Name]
  Date: [Date]
  Domain: TARGETDOMAIN

  Test Case 1: Login
    Action: Open application, log in with TARGETDOMAIN\\username
    Expected: Successful login, home screen displays
    Result: [ ] Pass  [ ] Fail
    Notes: ________________________________

  Test Case 2: View existing data
    Action: Open record #12345
    Expected: Record displays with correct data
    Result: [ ] Pass  [ ] Fail
    Notes: ________________________________

  Test Case 3: Create new data
    Action: Create new record with test data
    Expected: Record saves successfully
    Result: [ ] Pass  [ ] Fail
    Notes: ________________________________

  Test Case 4: Generate report
    Action: Run [Monthly Summary] report
    Expected: Report generates with correct data
    Result: [ ] Pass  [ ] Fail
    Notes: ________________________________

  SIGN-OFF:
  [ ] All test cases passed
  [ ] Application owner approves migration
  Signature: _________________ Date: _________</pre>

<h4>Hyper-care period</h4>
<pre>WHAT: A period of elevated monitoring and support after migration (typically 1-2 weeks).
WHY: Issues may not surface immediately - some run on weekly schedules, month-end processes.

HYPER-CARE ACTIVITIES:
  Day 1-3:  Migration team actively monitors, responds within 15 min
  Day 4-7:  Normal support resumes, migration team on-call
  Day 8-14: Monitor for edge cases (month-end reports, scheduled jobs)
  Day 15:   Hyper-care ends, transition to BAU (business as usual)

WHAT TO WATCH:
  - Failed scheduled tasks (they run on schedules you may not know about)
  - Authentication failures in event logs
  - Application errors spiking
  - User-reported issues ("it worked before the migration")
  - Performance degradation</pre>

<div class="interview-tip">Interview tip: "I run validation in three phases. Pre-migration captures the baseline and confirms readiness. Post-migration validates technical function - services running, Kerberos working, no orphaned SQL users. Then UAT validates business function with the app owner. After sign-off, I maintain hyper-care for two weeks. I've seen issues surface 10 days later when a monthly batch job runs for the first time post-migration."</div>
`

      id: 'adm-server-app-migration',
      title: 'Server Application Migration Patterns',
      content: `
<h4>What it is</h4>
<p>When the JD says "on-premise to on-premise application migrations for servers," it means taking an application running on a server joined to the source domain and making it work in the target domain. There are three approaches, and you choose based on risk, complexity, and downtime tolerance.</p>

<h4>Migration approach 1: IN-PLACE REMEDIATION (most common)</h4>
<pre>WHAT: Keep the app on the same server. Update identity bindings.
      Server gets re-joined to target domain.

WHEN TO USE:
  - App is tightly coupled to the server (installed, configured, data local)
  - Rebuild would take too long or is too risky
  - Downtime window is short

STEPS:
  1. Pre-migration: Document all identity bindings (service accounts, SPNs, etc.)
  2. Create target domain accounts and groups
  3. During window: Update service accounts to target domain
  4. Update scheduled tasks
  5. Update IIS app pools (if applicable)
  6. Update config files with target domain references
  7. Re-join server to target domain (requires reboot)
      # Unjoin from source:
      Remove-Computer -UnjoinDomainCredential SOURCEDOMAIN\\admin -Force
      # Join to target:
      Add-Computer -DomainName target.local -Credential TARGETDOMAIN\\admin -Restart
  8. Verify services start under new accounts
  9. Run validation

RISK: Medium - lots of moving parts on a live server
DOWNTIME: 1-4 hours typically</pre>

<h4>Migration approach 2: CLONE/REBUILD (cleanest)</h4>
<pre>WHAT: Build a new server in target domain, install app fresh,
      migrate data from old to new.

WHEN TO USE:
  - App is simple to install
  - Server OS needs upgrading anyway
  - You want a clean state (no legacy cruft)
  - Higher downtime tolerance

STEPS:
  1. Build new server, join to target domain
  2. Install application on new server
  3. Configure with target domain accounts
  4. Migrate data (database restore, file copy, etc.)
  5. Update DNS to point to new server
  6. Validate
  7. Keep old server as rollback for 2 weeks

RISK: Low (clean build) but high effort
DOWNTIME: 2-8 hours (data migration dependent)</pre>

<h4>Migration approach 3: SWING MIGRATION</h4>
<pre>WHAT: Use a temporary intermediate server to minimize downtime.
      Old server -> copy to temp -> cutover -> copy to new.

WHEN TO USE:
  - Zero-downtime requirement
  - Database replication available (SQL Always On, log shipping)
  - Complex application that needs parallel running

STEPS:
  1. Set up SQL log shipping from old to new
  2. Install app on new server (target domain)
  3. Cutover: stop log shipping, bring new DB online
  4. Update DNS to point to new server
  5. Old server becomes rollback

RISK: Low downtime, high complexity
DOWNTIME: Minutes (DNS TTL dependent)</pre>

<h4>Server domain re-join (the mechanics)</h4>
<pre>When you re-join a server to a new domain, understand what happens:

1. Computer account is removed from source domain
2. Computer account is created in target domain
3. Server reboots
4. Server establishes secure channel with target DC
5. Computer gets new SID
6. Local group memberships referencing SOURCEDOMAIN are BROKEN
   - "SOURCEDOMAIN\\Domain Admins" was in local Administrators -> GONE
   - You must pre-add TARGETDOMAIN\\Domain Admins to local Administrators BEFORE re-join
   - Otherwise you lock yourself out

PRE-RE-JOIN CHECKLIST:
  [ ] Add TARGETDOMAIN\\Domain Admins to local Administrators group
      net localgroup Administrators TARGETDOMAIN\\Domain Admins /add
  [ ] Add TARGETDOMAIN service accounts to required local groups
  [ ] Document all local group memberships referencing source domain
      Get-LocalGroupMember -Group "Administrators"
      Get-LocalGroupMember -Group "Remote Desktop Users"
  [ ] Ensure target DC is reachable (ports 88, 389, 445, 135, 464)
  [ ] Have local admin credentials as backup (in case domain join fails)</pre>

<h4>Application types and their special considerations</h4>
<pre>IIS WEB APPLICATIONS:
  - App pool identity (change to target domain)
  - Web.config connection strings (update domain references)
  - Windows authentication settings (allow target domain)
  - SSL certificates (may reference old domain in SAN)
  - Service account for app pool needs "Log on as a service" right

FILE SERVERS:
  - Share permissions reference source domain SIDs
  - NTFS permissions reference source domain SIDs
  - Quest or ADMT can re-ACL permissions to target domain SIDs
  - DFS namespaces may need updating

PRINT SERVERS:
  - Printer permissions reference source domain groups
  - Print drivers may need re-deployment
  - GPO printer mappings need updating

CERTIFICATE AUTHORITY:
  - If source domain has AD Certificate Services, this is COMPLEX
  - Certificates issued reference source domain in templates
  - May need to migrate CA or build new one in target domain
  - All certificates may need re-issuance

MONITORING AGENTS (SCOM, Zabbix, etc.):
  - Service account for monitoring agent
  - May need re-registration with management server
  - Alert thresholds may need updating for migration noise</pre>

<div class="interview-tip">Interview tip: "I classify every application into one of three migration approaches: in-place remediation for complex apps that can't be rebuilt easily, clone/rebuild for simpler apps where we want a clean state, or swing migration for zero-downtime requirements using SQL log shipping. The decision depends on downtime tolerance, application complexity, and whether the server OS needs upgrading anyway."</div>
`

      id: 'adm-dns-certificates',
      title: 'DNS, Certificates & Network Identity in Migration',
      content: `
<h4>DNS in a domain migration</h4>
<p>DNS is the phonebook of your network. Every server, every application URL, every domain controller - all found via DNS. When you migrate domains, DNS gets complicated because the old domain name doesn't just disappear. Applications, scripts, bookmarks, and muscle memory all reference the old names.</p>

<h4>DNS zones you're dealing with</h4>
<pre>SOURCE DOMAIN DNS:
  source.local (AD-integrated zone)
    - DC records: dc01.source.local, dc02.source.local
    - Server records: sqlserver01.source.local, appserver01.source.local
    - SRV records: _ldap._tcp.source.local (how clients find DCs)
    - Application CNAMEs: erp.source.local -> appserver01.source.local

TARGET DOMAIN DNS:
  target.local (AD-integrated zone)
    - New DC records: dc01.target.local, dc02.target.local
    - New server records: (created as servers join target domain)
    - SRV records: _ldap._tcp.target.local
    - Application CNAMEs: need to create these</pre>

<h4>DNS migration strategy</h4>
<pre>OPTION 1: CNAME BRIDGE (recommended during coexistence)
  Keep old DNS names working by pointing them to new locations.
  erp.source.local -> CNAME -> erp.target.local -> A record -> 10.0.1.50
  This way, anything still using the old name still works.

OPTION 2: CONDITIONAL FORWARDERS
  Source DNS forwards queries for target.local to target DCs.
  Target DNS forwards queries for source.local to source DCs.
  Both domains can resolve each other.

OPTION 3: STUB ZONES
  Source DNS holds a copy of target.local NS records.
  Lighter than conditional forwarder, auto-updates.

DURING MIGRATION:
  Phase 1: Set up conditional forwarders both directions
  Phase 2: As servers migrate, update DNS records
  Phase 3: Create CNAMEs from old names to new names
  Phase 4: After decommission, keep CNAMEs for 6 months
  Phase 5: Remove old DNS zone</pre>

<h4>DNS records to update per server</h4>
<pre>WHEN A SERVER MIGRATES TO TARGET DOMAIN:
  1. New A record created automatically: server01.target.local
  2. Old A record still exists: server01.source.local (points to same IP)
  3. Create CNAME: server01.source.local -> server01.target.local
     (only if old A record is removed)
  4. Or: keep both A records during coexistence (both resolve)
  5. Update application CNAMEs to point to new name
  6. Reduce TTL before migration (300 seconds = 5 min, so changes propagate fast)

CRITICAL: Reduce DNS TTL to 300 seconds 24-48 hours BEFORE the migration window.
Default TTL is often 3600 (1 hour). If something goes wrong, you don't want to
wait an hour for DNS to update during rollback.</pre>

<h4>Certificates in a domain migration</h4>
<pre>WHY CERTIFICATES BREAK:
  Certificates contain the server's identity in the Subject and SAN fields.
  Example: CN=erp.source.local, SAN=erp.source.local
  If the server moves to target.local and clients access it via erp.target.local,
  the certificate is for the wrong name -> browser/app shows certificate error.

CERTIFICATE SCENARIOS:

Scenario 1: Server keeps old DNS name (via CNAME)
  Certificate still valid. No action needed.
  erp.source.local CNAME -> erp.target.local -> cert is for erp.source.local -> matches

Scenario 2: Server gets new DNS name
  Need new certificate with new name.
  Request cert: CN=erp.target.local, SAN=erp.target.local, erp.source.local
  Including old name in SAN handles both during transition.

Scenario 3: Internal CA (AD Certificate Services) on source domain
  Templates reference source domain
  Auto-enrollment uses source domain policies
  Options:
    a) Build new CA in target domain (recommended for inter-forest)
    b) Migrate CA (complex, Microsoft has documentation)
    c) Use public CA (Let's Encrypt, DigiCert) - simpler, no AD dependency

CERTIFICATE CHECKLIST PER APPLICATION:
  [ ] What certificate is installed? (thumbprint, CN, SAN, expiry)
      Get-ChildItem Cert:\\LocalMachine\\My | Select Subject, Thumbprint, NotAfter
  [ ] Does the certificate name match the new DNS name?
  [ ] If not: request new certificate
  [ ] If using auto-enrollment: configure in target domain CA
  [ ] Update application binding to use new certificate
      # IIS example:
      netsh http show sslcert    (shows current binding)
      # Update in IIS Manager > Site > Bindings > Edit</pre>

<div class="interview-tip">Interview tip: "For DNS, I reduce TTL to 5 minutes 48 hours before migration so DNS changes propagate quickly during cutover. I set up conditional forwarders between domains for coexistence, and use CNAMEs from old names to new names so applications using the old DNS still resolve. For certificates, I request new certs with both old and new names in the SAN field to cover the transition period."</div>
`

      id: 'adm-computer-migration',
      title: 'Computer & Workstation Migration',
      content: `
<h4>What it is</h4>
<p>Every Windows computer in the source domain needs to be moved to the target domain. For 300+ workstations, this means a structured wave approach, not one-by-one. The computer gets a new domain membership, new GPOs apply, and the user logs in with target domain credentials.</p>

<h4>Computer migration methods</h4>
<pre>METHOD 1: QUEST MIGRATION MANAGER (recommended for scale)
  - Quest agent on workstation handles the re-join
  - Preserves local profiles (user doesn't lose desktop, files)
  - Can be scripted and scheduled
  - Handles local group membership update automatically
  - Requires reboot

METHOD 2: ADMT (Active Directory Migration Tool)
  - Free Microsoft tool
  - Computer Migration Wizard
  - Translates local profiles and permissions
  - Less automation than Quest
  - Requires ADMT agent installed on target DC

METHOD 3: MANUAL RE-JOIN
  - Remove from source domain, join to target domain
  - Simple but doesn't scale
  - Risk of profile loss if not handled correctly
  - Use for one-offs or troubleshooting

METHOD 4: WINDOWS AUTOPILOT RESET (modern approach)
  - If moving to cloud-managed (Intune) simultaneously
  - Wipes and re-provisions device
  - User gets fresh start
  - Only if acceptable to lose local state</pre>

<h4>Quest computer migration (step by step)</h4>
<pre>PRE-MIGRATION:
  1. User migration completed (user account exists in target domain)
  2. Target domain groups created with correct membership
  3. GPOs prepared in target domain
  4. Quest agent deployed to workstation (can be pushed via GPO or SCCM)

MIGRATION:
  5. Quest console: select computers for this wave
  6. Quest translates local profile:
     - SOURCEDOMAIN\\jsmith profile -> TARGETDOMAIN\\jsmith profile
     - Desktop, Documents, AppData, registry - all preserved
  7. Quest updates local group memberships:
     - Removes SOURCEDOMAIN\\Domain Users from local Users group
     - Adds TARGETDOMAIN\\Domain Users
     - Same for any other local group references
  8. Quest re-joins computer to target domain
  9. Computer reboots

POST-MIGRATION:
  10. User logs in with TARGETDOMAIN\\jsmith (or jsmith@target.local)
  11. Target domain GPOs apply
  12. User profile loads with all their files and settings
  13. Validate: mapped drives, printers, applications all work</pre>

<h4>User profile preservation (critical)</h4>
<pre>THE PROBLEM:
  Windows profiles are stored as: C:\\Users\\SOURCEDOMAIN.jsmith\\
  When user logs in as TARGETDOMAIN\\jsmith, Windows creates NEW profile:
  C:\\Users\\TARGETDOMAIN.jsmith\\
  User loses: desktop icons, documents, favorites, app settings, Outlook profile

THE SOLUTION (what Quest does):
  Quest updates the profile registry keys to map the old profile to the new identity.
  HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\ProfileList\\
  The SID-keyed profile entry gets updated with the new SID.
  Result: User logs in with new domain credentials, gets their OLD profile.

MANUAL APPROACH (if not using Quest):
  1. Log in as local admin
  2. Join computer to target domain
  3. Reboot
  4. Before user logs in:
     - Note old profile SID in ProfileList registry
     - Log in as TARGETDOMAIN\\jsmith (creates new profile)
     - Log out
     - Copy contents of old profile folder to new profile folder
     - OR: Update registry to point new SID to old profile path
  5. This is error-prone at scale - use Quest</pre>

<h4>Wave planning for 300+ workstations</h4>
<pre>WAVE STRUCTURE:
  Wave 0: IT department (10 computers) - Week 1
    Purpose: Prove the process works, find issues early
    Duration: 1 day migration + 3 days hyper-care

  Wave 1: Small department (20 computers) - Week 2
    Purpose: First real business users, validate user experience
    Duration: 1 day migration + 3 days hyper-care

  Wave 2-5: Remaining departments (50-80 each) - Weeks 3-6
    Purpose: Bulk migration, refined process
    Duration: 1-2 days migration + 5 days hyper-care each

  Wave 6: Stragglers and exceptions - Week 7
    Purpose: VIPs, problematic machines, special configurations
    Duration: As needed

SCHEDULING:
  - Migrate during off-hours (evening or weekend) to minimize disruption
  - Or: migrate during work day with 30-min downtime per machine
  - User communication: "Your computer will reboot at 2:00 PM, save all work"
  - Have support staff on floor during wave for immediate issues

COMMON POST-MIGRATION ISSUES:
  - Mapped drives not connecting (GPO hasn't applied yet -> gpupdate /force)
  - Printers missing (GPO-deployed printers need target domain GPO)
  - Outlook profile broken (new profile needed, or Quest handles it)
  - Application can't connect (still looking for source domain resources)
  - Cached credentials (user laptop was offline during migration -> credential conflict)</pre>

<div class="interview-tip">Interview tip: "For 300+ workstations, I'd use Quest Migration Manager with a wave approach. Wave 0 is IT staff - they're our test group and can troubleshoot their own issues. Each subsequent wave is a department, with the migration running after hours and desktop support on the floor the next morning. The key is profile preservation - Quest handles the profile SID mapping so users don't lose their desktop, documents, or application settings."</div>
`

      id: 'tools-itsm',
      title: 'ITSM & Ticketing - ServiceNow, Jira, BMC',
      content: `
<h4>What is ITSM</h4>
<p>IT Service Management (ITSM) is the framework and toolset for managing IT services. Every action in enterprise IT flows through a ticket - incidents, changes, requests, problems. "No ticket, no work" is the rule. The ticketing system is the source of truth for what happened, when, and who did it.</p>

<h4>The tools</h4>
<pre>SERVICENOW (dominant in enterprise):
  What: Cloud-based ITSM platform. Handles incidents, changes, problems,
        asset management, CMDB, knowledge base, workflows.
  Why it wins: Highly customizable, integrates with everything, ITIL-aligned.
  Used by: Most Fortune 500 companies.
  Key modules:
    - Incident Management (break/fix tickets)
    - Change Management (RFC, CAB approval workflows)
    - Problem Management (root cause analysis)
    - CMDB (Configuration Management Database - inventory of all IT assets)
    - Knowledge Base (documented solutions)
    - Service Catalog (self-service portal for users)
  Your role: Create/update incidents and changes. Use CMDB for asset lookup.
             Build knowledge articles for recurring issues.

JIRA SERVICE MANAGEMENT (Atlassian):
  What: ITSM built on Jira. Popular in tech companies and mid-market.
  Strength: Dev and IT on same platform (Jira for dev, JSM for IT).
  Used by: Tech companies, startups scaling up, mid-size orgs.
  Key features: Queues, SLA tracking, automation rules, Confluence integration.

BMC REMEDY / HELIX:
  What: Legacy enterprise ITSM. Being replaced by ServiceNow in many orgs.
  Still used by: Government, healthcare, old-school enterprises.
  Know it exists but don't deep-dive unless a JD mentions it.

FRESHSERVICE:
  What: Cloud ITSM for small/mid orgs. Simple, affordable.
  Used by: Companies with 100-1000 employees.</pre>

<h4>ITIL processes mapped to tools</h4>
<pre>Process              What it is                          Tool module
Incident Mgmt        "Something is broken, fix it"        ServiceNow Incident
Change Mgmt          "I want to change something"         ServiceNow Change
Problem Mgmt         "Why does this keep breaking?"        ServiceNow Problem
Request Fulfillment  "I need access/software/equipment"   ServiceNow Catalog
Asset Mgmt           "What do we own and where is it?"    ServiceNow CMDB
Knowledge Mgmt       "How do we fix this common issue?"   ServiceNow KB</pre>

<h4>CMDB (Configuration Management Database)</h4>
<pre>What: A database of every IT asset and how they relate to each other.
  Server APP-SRV01:
    - OS: Windows Server 2022
    - IP: 10.0.3.15
    - Application: ERP System
    - Owner: Finance Department
    - Depends on: SQL-SRV01 (database)
    - Depends on: DC01 (authentication)

Why it matters for migration:
  - CMDB tells you which applications run on which servers
  - Relationship mapping shows dependencies
  - Impact analysis: "If I migrate SQL-SRV01, what else is affected?"

      title: 'Backup & DR - Veeam, Rubrik, Azure Backup, Commvault',
      content: `
<h4>What is enterprise backup</h4>
<p>Backup tools create copies of your data and systems so you can recover from hardware failure, ransomware, accidental deletion, or failed migrations. In enterprise, backup is not optional - it's a compliance requirement. Every server, every database, every critical system has a backup schedule and a tested recovery plan.</p>

<h4>Key concepts</h4>
<pre>RPO (Recovery Point Objective):
  "How much data can we afford to lose?"
  RPO = 1 hour means backups run at least every hour.
  If disaster strikes, you lose at most 1 hour of data.

RTO (Recovery Time Objective):
  "How fast do we need to be back up?"
  RTO = 4 hours means you must restore service within 4 hours.

3-2-1 Rule:
  3 copies of data
  2 different media types (disk + tape, or disk + cloud)
  1 offsite copy (different location or cloud)

Backup types:
  Full   - everything, every time. Slowest, most storage, fastest restore.
  Incremental - only what changed since LAST backup. Fast, small, slower restore.
  Differential - only what changed since last FULL. Middle ground.</pre>

<h4>The tools</h4>
<pre>VEEAM (market leader for virtualization backup):
  What: Backup and replication for VMs, physical servers, cloud workloads, M365.
  Strength: VMware/Hyper-V integration is excellent. Fast restore. Easy to use.
  Key features:
    - Image-level backup (entire VM as a single file)
    - Instant VM Recovery (boot backup directly as VM in minutes)
    - SureBackup (automated backup verification - actually boots the backup and tests it)
    - Veeam ONE (monitoring and reporting for backup environment)
    - M365 backup (Exchange, SharePoint, Teams, OneDrive)
  Used by: Most enterprises with VMware or Hyper-V.
  Your role: Configure backup jobs, monitor success/failure, test restores.

RUBRIK (modern, API-first):
  What: Backup-as-a-service appliance. Drop it in, it manages itself.
  Strength: Immutable backups (ransomware can't encrypt them), API-driven, SLA-based.
  Key concept: You define an SLA ("Gold = backup every 4 hours, keep 30 days")
               and assign VMs/databases to SLAs. Rubrik handles the rest.
  Used by: Enterprises modernizing backup, security-conscious orgs.

COMMVAULT:
  What: Enterprise backup for everything (physical, virtual, cloud, SaaS, database).
  Strength: Broad coverage - if it exists, Commvault can back it up.
  Weakness: Complex to manage, steep learning curve.
  Used by: Large enterprises with diverse environments.

AZURE BACKUP:
  What: Microsoft's cloud backup service.
  Backs up: Azure VMs, on-prem VMs (via agent), SQL, file shares, M365 (limited).
  Strength: Native Azure integration, no infrastructure to manage.
  Key component: Recovery Services Vault (where backups are stored).
  Used by: Azure-heavy environments, hybrid setups.

WINDOWS SERVER BACKUP (built-in):
  What: Free, basic backup built into Windows Server.
  Use for: System state backup (AD, registry, boot files).
  Critical for: Domain controller backup before migration.
  Not suitable for: Enterprise-scale backup management.</pre>

<h4>Backup in migration context</h4>
<pre>BEFORE ANY MIGRATION:
  1. Verify latest backup exists and is recent
  2. Verify backup is restorable (don't trust "success" status - test it)
  3. For SQL: Take a manual full backup with CHECKSUM
  4. For AD: System state backup of domain controllers
  5. For servers: Full image backup or Veeam snapshot
  6. Document backup locations and restore procedures in runbook

IF MIGRATION FAILS:
  7. Restore SQL database from pre-migration backup
  8. Restore server from image backup if domain re-join failed
  9. System state restore if DC was affected (last resort)</pre>

<div class="interview-tip">Interview tip: "Before any migration, I verify backups are current and restorable - not just that the backup job says 'success.' I take a manual SQL backup with CHECKSUM before database changes, and a system state backup before domain operations. The backup is my rollback safety net."</div>
`

      id: 'tools-pam',
      title: 'PAM & Secrets - CyberArk, BeyondTrust, HashiCorp Vault',
      content: `
<h4>What is PAM</h4>
<p>Privileged Access Management (PAM) controls and monitors who uses admin accounts. In enterprise, you don't just "know the admin password." Admin credentials are stored in a vault, checked out when needed, automatically rotated, and every use is logged. This prevents insider threats and limits damage from compromised accounts.</p>

<h4>The problem PAM solves</h4>
<pre>WITHOUT PAM:
  - 15 engineers share the same Domain Admin password
  - Password is in a spreadsheet or someone's head
  - Password hasn't been changed in 2 years
  - No audit trail of who used it when
  - If one engineer is compromised, attacker has Domain Admin
  - Service account passwords are hard-coded in scripts

WITH PAM:
  - Admin credentials stored in encrypted vault
  - Engineer requests access, gets temporary credential
  - Session is recorded (video replay of what they did)
  - Password auto-rotates after use
  - Full audit trail: who, when, what, from where
  - Service accounts managed and rotated automatically</pre>

<h4>The tools</h4>
<pre>CYBERARK (market leader):
  What: Full PAM suite - vault, session management, password rotation.
  Components:
    - Digital Vault: encrypted storage for credentials
    - PSM (Privileged Session Manager): proxies and records admin sessions
    - CPM (Central Policy Manager): auto-rotates passwords on schedule
    - PTA (Privileged Threat Analytics): detects anomalous privileged activity
    - AAM (Application Access Manager): manages credentials for applications
  How it works for you:
    1. You need to RDP to a server as admin
    2. Open CyberArk portal, find the server
    3. Click "Connect" - CyberArk retrieves the password from the vault
    4. PSM opens an RDP session (you never see the actual password)
    5. Your session is recorded
    6. After you disconnect, the password may auto-rotate
  Used by: Banks, healthcare, government, any regulated industry.

BEYONDTRUST (strong in endpoint privilege):
  What: PAM + endpoint privilege management.
  Strength: Removing local admin rights from workstations while letting
            users install approved software (privilege elevation on demand).
  Products:
    - Password Safe: credential vault (like CyberArk vault)
    - Remote Support: secure remote access with session recording
    - Privilege Management: remove local admin, elevate per-app
  Used by: Enterprises focused on endpoint security.

HASHICORP VAULT (for DevOps/cloud):
  What: Secrets management for applications and infrastructure.
  Strength: API-first, dynamic secrets, cloud-native.
  Use case: Store API keys, database passwords, certificates.
             Applications request secrets at runtime instead of hard-coding.
  Used by: DevOps teams, cloud-native environments.
  Less relevant for traditional AD migration but know it exists.

THYCOTIC / DELINEA (mid-market PAM):
  What: Secret Server (password vault) + Privilege Manager (endpoint).
  Strength: Easier to deploy than CyberArk, good for mid-market.
  Used by: Companies that need PAM but CyberArk is too complex/expensive.</pre>

<h4>PAM in migration context</h4>
<pre>BEFORE MIGRATION:
  - Service account passwords managed in CyberArk need to be coordinated
  - If CyberArk auto-rotates the password during migration window = disaster
  - FREEZE password rotation for migration targets before the change window

DURING MIGRATION:
  - Check out admin credentials from vault for migration activities
  - All migration actions should be through PSM (recorded session)
  - Create temporary privileged access if needed (with expiry)

AFTER MIGRATION:
  - Update CyberArk to manage new target domain accounts
  - Onboard new service accounts to the vault
  - Remove old source domain accounts from vault management
  - Resume password rotation</pre>

<div class="interview-tip">Interview tip: "I work with CyberArk for privileged access. During migrations, I coordinate with the PAM team to freeze password rotation on affected service accounts before the change window. All migration activities go through PSM for audit trail. After migration, I onboard the new target domain service accounts to CyberArk and resume rotation."</div>
`

      content: `
<h4>What is SIEM</h4>
<p>Security Information and Event Management (SIEM) collects logs from every system, correlates them, and detects threats. Think of it as a security camera system for your entire IT environment - every login, every file access, every network connection is logged, and the SIEM watches for suspicious patterns.</p>

<h4>The tools</h4>
<pre>SPLUNK (most widely deployed):
  What: Log aggregation, search, analysis, and alerting platform.
  Not just SIEM: Splunk is a general-purpose log platform. Security is one use case.
  Strength: Searches any data. "Google for your logs."
  Query language: SPL (Search Processing Language)
    Example: index=windows sourcetype=WinEventLog EventCode=4625
             | stats count by Account_Name
             (Find all failed login attempts grouped by account)
  Components:
    - Forwarders: collect logs from servers/devices
    - Indexers: store and index the data
    - Search Heads: where you query and build dashboards
    - Splunk Enterprise Security (ES): SIEM add-on with correlation rules
  Used by: Large enterprises, security-heavy orgs.
  Cost: Expensive (licensed by daily data ingestion volume).

MICROSOFT SENTINEL (cloud SIEM):
  What: Cloud-native SIEM built on Azure Log Analytics.
  Strength: Native integration with M365, Entra ID, Azure, Defender.
  Query language: KQL (Kusto Query Language) - same as Azure Monitor.
  Key features:
    - Data connectors: plug in any log source (M365, firewalls, servers)
    - Analytics rules: detect threats automatically
    - Playbooks: automated response (Logic Apps)
    - Workbooks: dashboards and reports
    - UEBA: user and entity behavior analytics
  Used by: Microsoft-heavy environments, cloud-forward orgs.
  Cost: Per GB ingested (some M365 logs are free).

IBM QRADAR:
  What: Enterprise SIEM with strong correlation engine.
  Strength: Offense detection, network flow analysis.
  Used by: Government, financial services, traditional enterprise.
  Know it exists, less common in new deployments.

CROWDSTRIKE FALCON (EDR/XDR, not pure SIEM):
  What: Endpoint Detection and Response. Agent on every workstation/server.
  What it does: Detects malware, ransomware, lateral movement, suspicious behavior.
  Strength: Lightweight agent, cloud-managed, excellent threat intelligence.
  How it differs: SIEM = log aggregation + correlation. EDR = endpoint-level threat detection.
  Often paired with SIEM: CrowdStrike detects on endpoint, sends alerts to Splunk/Sentinel.
  Used by: Most enterprises as endpoint security layer.

MICROSOFT DEFENDER FOR ENDPOINT (EDR):
  What: Microsoft's EDR product. Competes with CrowdStrike.
  Strength: Integrated with M365 Defender, Intune, Sentinel.
  Used by: Microsoft-stack enterprises.</pre>

<h4>SIEM in migration context</h4>
<pre>BEFORE MIGRATION:
  - Alert SIEM team: "Expect unusual login patterns during migration window"
  - Create temporary suppression rules (so migration activity doesn't trigger incident)
  - Baseline normal authentication patterns

DURING MIGRATION:
  - SIEM will see: new domain logins, failed auth attempts (expected during cutover)
  - Without suppression: SOC gets flooded with false positives
  - WITH suppression: only genuinely suspicious activity triggers alerts

AFTER MIGRATION:
  - Remove suppression rules
  - Update SIEM log sources (new DCs, new domain name in logs)
  - Update correlation rules for new domain name
  - Verify logs flowing from migrated servers
  - Watch for: accounts still authenticating to OLD domain (missed remediation)</pre>

<div class="interview-tip">Interview tip: "During migrations, I coordinate with the SOC to create temporary alert suppressions for expected authentication changes. After migration, I verify log sources are updated in Splunk/Sentinel so security monitoring isn't blind to the migrated environment. I also watch for authentication attempts against the old domain - that tells me which applications we missed in remediation."</div>
`

      content: `
<h4>What is enterprise remote access</h4>
<p>How administrators securely connect to servers and how remote employees connect to the network. Enterprise doesn't use TeamViewer or AnyDesk for production - they use purpose-built, audited, and secured tools.</p>

<h4>The tools</h4>
<pre>AZURE BASTION:
  What: Managed jump box service. Provides RDP/SSH to Azure VMs without public IPs.
  How: You connect through Azure Portal. Bastion proxies to the VM over private network.
  Strength: No public IP exposure. No VPN client needed. HTML5 browser-based.
  Used for: All Azure VM admin access. Eliminates "RDP exposed to internet" risk.

VPN (Virtual Private Network):
  Types in enterprise:
    - Site-to-Site: office network to Azure/datacenter (always-on, hardware VPN appliance)
    - Point-to-Site: individual user laptop to Azure/datacenter (VPN client)
    - SSL VPN: browser-based VPN (Cisco AnyConnect, Palo Alto GlobalProtect)
  Vendors: Cisco AnyConnect, Palo Alto GlobalProtect, Fortinet FortiClient, Zscaler ZPA

JUMP BOX / BASTION HOST (on-prem):
  What: A hardened server in a DMZ that admins RDP/SSH into first, then hop to target servers.
  Why: No direct RDP from workstation to production server. The jump box is the single entry point.
  Security: MFA to access jump box. Session recording. Limited tools installed.
  Being replaced by: Azure Bastion (cloud), CyberArk PSM (PAM-based).

RDP (Remote Desktop Protocol):
  What: Windows built-in remote access. Port 3389.
  Enterprise rules:
    - NEVER expose RDP to the internet
    - Always through VPN, jump box, or Bastion
    - NLA (Network Level Authentication) enabled
    - Restrict via NSG/firewall to admin subnets only

RMM (Remote Monitoring & Management):
  What: Tools for managing endpoints remotely (MSP and IT support).
  Products: ConnectWise Automate, Datto RMM, NinjaRMM
  Used by: MSPs and IT support teams for remote desktop control.
  Enterprise alternative: SCCM Remote Control, CyberArk PSM.

WINDOWS ADMIN CENTER:
  What: Microsoft's web-based server management tool.
  Replaces: Many traditional MMC snap-ins (Server Manager, Event Viewer, etc.)
  Access: Browser-based, connect to servers on your network.
  Features: Performance monitoring, registry editing, role management, file browsing.
  Good for: Quick server management tasks without full RDP.</pre>

<h4>Secure remote access architecture (enterprise pattern)</h4>
<pre>REMOTE ADMIN accessing production server:

  Laptop --[VPN]--> Corporate Network --[Jump Box/CyberArk PSM]--> Production Server
    MFA at VPN       Firewall rules       Session recorded         NSG limits access
    Split tunnel     Segment admin         Credentials from vault   No internet access
    or full tunnel   traffic from user     Time-limited access      Hardened OS

  For Azure VMs:
  Laptop --[Browser]--> Azure Portal --[Bastion]--> Azure VM
    MFA via Entra       RBAC controls     Private IP only     No public IP needed
    CA policy           Audit logged       HTML5 RDP           NSG blocks all else</pre>

<div class="interview-tip">Interview tip: "For server administration, I always go through a secured path - Azure Bastion for cloud VMs, VPN plus jump box for on-prem servers, or CyberArk PSM when available. I never expose RDP directly to the internet and always ensure NLA is enabled. During migrations, I pre-validate that Bastion or VPN connectivity works to the target environment before the change window."</div>

<h4>What is enterprise virtualization</h4>
<p>Virtualization lets you run multiple virtual servers (VMs) on a single physical server. Instead of buying 50 physical servers, you buy 5 powerful ones and run 10 VMs each. Enterprise IT runs almost everything on VMs - domain controllers, application servers, SQL servers, file servers.</p>

<h4>The tools</h4>
<pre>VMWARE vSPHERE (dominant in enterprise):
  Components:
    - ESXi: The hypervisor installed on physical servers (bare-metal)
    - vCenter Server: Central management for all ESXi hosts
    - vSphere Client: Web UI for managing everything
    - vMotion: Live-migrate a running VM to another host (zero downtime)
    - vSAN: Software-defined storage across ESXi hosts
    - DRS: Distributed Resource Scheduler (auto-balances VMs across hosts)
    - HA: High Availability (auto-restart VMs if host fails)

  Key concepts:
    - Cluster: group of ESXi hosts managed together
    - Datastore: shared storage where VM files live
    - Snapshot: point-in-time capture of VM state (NOT a backup)
    - Template: golden image VM used to deploy new VMs quickly
    - Resource Pool: allocate CPU/memory limits to groups of VMs

  Migration relevance:
    - Take VM snapshot before migration (rollback in seconds)
    - Clone VM for testing migration in isolated environment
    - vMotion to move VM to maintenance host during migration

MICROSOFT HYPER-V:
  What: Microsoft's hypervisor. Built into Windows Server.
  Management: Hyper-V Manager (single host) or SCVMM (System Center Virtual Machine Manager) for multi-host.
  Features: Live Migration (like vMotion), checkpoints (like snapshots), Replica (DR).
  Used by: Microsoft-stack shops, orgs that don't want VMware licensing costs.
  Trend: Declining. Broadcom's VMware acquisition is pushing some orgs to Hyper-V or Nutanix.

NUTANIX:
  What: Hyper-converged infrastructure (HCI). Compute + storage + virtualization in one box.
  Hypervisor: AHV (their own, free) or runs VMware ESXi.
  Strength: Simplified infrastructure. Scale by adding nodes.
  Used by: Enterprises modernizing datacenter.

PROXMOX:
  What: Open-source virtualization platform. KVM + LXC.
  Used by: Homelabs, small businesses, cost-conscious orgs.
  Not common in enterprise but good for personal labs.</pre>

<h4>Virtualization in migration context</h4>
<pre>BEFORE MIGRATION:
  1. Take VM snapshot of every server being migrated
     WHY: If migration fails, revert snapshot = instant rollback
     WARNING: Snapshots are NOT backups. Delete within 72 hours.
     Large snapshots degrade performance.

  2. Clone critical VMs for testing

     Validate without risking production

DURING MIGRATION:
  3. If server needs reboot (domain re-join), schedule on VMware
  4. Monitor VM resource usage (migration adds CPU/memory load)

AFTER MIGRATION:
  5. Delete snapshots (within 24-72 hours)
  6. Update VM notes/annotations with new domain info
  7. Update VMware tags/folders if organized by domain</pre>

<h4>What is enterprise patch management</h4>
<p>Patch management is the process of testing, approving, and deploying software updates (security patches, bug fixes, feature updates) across your environment. Microsoft releases patches on the second Tuesday of every month ("Patch Tuesday"). Unpatched systems are the #1 attack vector for ransomware.</p>

<h4>The tools</h4>
<pre>WSUS (Windows Server Update Services):
  What: Free Microsoft tool for managing Windows updates.
  How: WSUS server downloads updates from Microsoft, admins approve,
       clients pull approved updates from WSUS.
  Limitation: Windows updates only. No third-party patching.
  Used by: Small orgs or as a component of larger solutions.

SCCM/MECM Software Update Point:
  What: SCCM's patching module. Uses WSUS under the hood.
  Strength: Patch + deploy + compliance reporting in one tool.
  Features:
    - Software Update Groups (bundle patches)
    - Maintenance Windows (deploy only during approved times)
    - Automatic Deployment Rules (auto-approve and deploy monthly)
    - Compliance reporting (which servers are missing patches)
  Used by: Enterprises with SCCM already deployed.

AZURE UPDATE MANAGER:
  What: Cloud-native patching for Azure VMs and Arc-connected on-prem servers.
  Strength: No infrastructure to manage. Works for Azure and on-prem.
  Features:
    - Assess: show which updates are missing
    - Patch: deploy updates on schedule
    - Maintenance configurations: define patch windows
  Used by: Azure and hybrid environments.

INTUNE WINDOWS UPDATE FOR BUSINESS:
  What: Cloud-managed Windows Update via Intune.
  Features:
    - Update rings (pilot -> broad deployment)
    - Feature update deferrals (delay major updates by X days)
    - Quality update deferrals (delay security patches by X days)
    - Expedite critical updates (push immediately)
  Used by: Intune-managed devices (modern management).

RAPID7 InsightVM / NEXPOSE:
  What: Vulnerability scanner + patch priority.
  What it does: Scans servers for missing patches AND known vulnerabilities.
  Strength: Risk-based prioritization. "This unpatched CVE has active exploits in the wild."
  Used by: Security-focused orgs, compliance requirements.

QUALYS:
  What: Cloud vulnerability management platform.
  Similar to Rapid7 but SaaS-based.
  Used by: Large enterprises, especially for compliance scanning.

IVANTI (formerly Shavlik):
  What: Patch management for Windows, macOS, Linux, and third-party apps.
  Strength: Third-party patching (Chrome, Java, Adobe, etc.)
  Used by: Orgs needing cross-platform and third-party patching.</pre>

<h4>Patch management process</h4>
<pre>MONTHLY CYCLE (Patch Tuesday + 2 weeks):
  Week 1 (Patch Tuesday):
    - Microsoft releases patches
    - Review security bulletins and CVE severity
    - Download to WSUS/SCCM
    - Deploy to TEST environment

  Week 2:
    - Validate patches in test (no application breakage)
    - Approve for pilot group (IT department, 10% of servers)
    - Monitor for issues

  Week 3:
    - Approve for production (broad deployment)
    - Deploy during maintenance windows (weekends/evenings)
    - Monitor compliance

  Week 4:
    - Remediate stragglers (servers that failed to patch)
    - Compliance reporting to management
    - Exception handling (servers that CAN'T be patched yet)</pre>

<h4>Patching in migration context</h4>
<pre>BEFORE MIGRATION:
  - Ensure all servers are fully patched (don't migrate a vulnerable server)
  - Check if pending reboot from patches (could conflict with migration reboot)
  - Pause automatic patch deployment during migration window

DURING MIGRATION:
  - No patching. Change freeze during migration window.

AFTER MIGRATION:
  - Verify patch compliance on migrated servers
  - Update WSUS/SCCM groups to reflect new domain membership
  - Resume automatic patch deployment
  - Run vulnerability scan to confirm no regressions</pre>

<div class="interview-tip">Interview tip: "I manage patching on a monthly cycle aligned to Patch Tuesday. Patches go to test first, then a pilot group, then broad deployment with a two-week lag for stability. During migrations, I freeze patching to avoid conflicts and resume immediately after with a compliance scan to verify nothing regressed."</div>
`

      id: 'ws-dhcp',
      title: 'DHCP Server - Scopes, Reservations, Options, Failover',
      content: `
<h4>What it is</h4>
<p>DHCP (Dynamic Host Configuration Protocol) automatically assigns IP addresses to devices on the network. Without DHCP, you'd manually configure every workstation, printer, and phone. In enterprise, DHCP servers hand out IPs from defined pools called scopes.</p>

<h4>How DHCP works - the 4-step handshake (DORA)</h4>
<pre>1. DISCOVER - Client broadcasts "I need an IP address" (UDP 67/68)
2. OFFER    - DHCP server responds "Here's 10.0.1.50, available for 8 hours"
3. REQUEST  - Client says "I'll take 10.0.1.50 please"
4. ACK      - Server confirms "10.0.1.50 is yours for 8 hours"

This is a BROADCAST. DHCP only works within the same subnet unless
you configure a DHCP relay agent (ip helper-address on the router).</pre>

<h4>Step-by-step: Install and configure DHCP</h4>
<pre>STEP 1: Install the role
  Install-WindowsFeature -Name DHCP -IncludeManagementTools

STEP 2: Authorize the DHCP server in Active Directory
  WHY: Prevents rogue DHCP servers on the network.
  Only domain-joined, authorized DHCP servers can issue leases.

  Add-DhcpServerInDC -DnsName dhcp01.contoso.com -IPAddress 10.0.1.10

STEP 3: Create a scope (the IP pool)
  Add-DhcpServerv4Scope -Name "Floor1-Workstations" \`
    -StartRange 10.0.1.100 \`
    -EndRange 10.0.1.200 \`
    -SubnetMask 255.255.255.0 \`
    -LeaseDuration 8:00:00 \`
    -State Active

  This creates a pool of 101 addresses (10.0.1.100 to 10.0.1.200).
  Lease lasts 8 hours. Client must renew at 50% (4 hours).

STEP 4: Set scope options (what clients get besides an IP)
  Set-DhcpServerv4OptionValue -ScopeId 10.0.1.0 \`
    -DnsServer 10.0.1.10,10.0.1.11 \`
    -DnsDomain contoso.com \`
    -Router 10.0.1.1

  OPTIONS EXPLAINED:
    Option 003 - Router/Default Gateway
    Option 006 - DNS Servers
    Option 015 - DNS Domain Name
    Option 044 - WINS Servers (legacy, still seen in old environments)
    Option 066 - Boot Server Host Name (PXE/SCCM)
    Option 067 - Boot File Name (PXE/SCCM imaging)</pre>

<h4>DHCP reservations</h4>
<pre>A reservation ties a specific MAC address to a specific IP.
Use for: printers, servers, network devices that need consistent IPs
         but you still want DHCP to manage their config.

Add-DhcpServerv4Reservation -ScopeId 10.0.1.0 \`
  -IPAddress 10.0.1.50 \`
  -ClientId "AA-BB-CC-DD-EE-FF" \`
  -Name "Printer-Floor1"

WHY reservations instead of static IPs?
  - Central management: change DNS servers in one place, all reserved devices get the update
  - Tracking: see all assignments in DHCP console
  - No login needed: don't need to touch the device to change network settings</pre>

<h4>DHCP exclusion ranges</h4>
<pre># Exclude IPs from being handed out (for static devices, servers)
Add-DhcpServerv4ExclusionRange -ScopeId 10.0.1.0 \`
  -StartRange 10.0.1.1 -EndRange 10.0.1.20

This reserves .1 through .20 for static assignments (routers, DCs, etc.)</pre>

<h4>DHCP failover (high availability)</h4>
<pre>Two modes:
  HOT STANDBY: Primary serves all leases. Standby takes over if primary dies.
    Use when: Branch office with one DHCP server and a backup in the datacenter.

  LOAD BALANCE (50/50): Both servers actively serve leases. Default split is 50/50.
    Use when: Both servers are in the same datacenter/site.

Add-DhcpServerv4Failover -Name "DHCP-Failover" \`
  -PartnerServer "dhcp02.contoso.com" \`
  -ScopeId 10.0.1.0 \`
  -SharedSecret "P@ssw0rd!" \`
  -LoadBalancePercent 50

KEY: Both servers must be authorized in AD.
KEY: Failover replicates scopes, reservations, and leases automatically.</pre>

<h4>Troubleshooting DHCP</h4>
<pre>CLIENT NOT GETTING AN IP:
  1. ipconfig /release && ipconfig /renew    (force new lease)
  2. Check scope has available addresses     (Get-DhcpServerv4ScopeStatistics)
  3. Check scope is Active, not Inactive
  4. Check DHCP relay agent if client is on different subnet
  5. Check Windows Firewall on DHCP server (UDP 67/68 must be allowed)
  6. Check DHCP server is authorized in AD

CLIENT GETTING WRONG GATEWAY/DNS:
  Check scope options vs server options vs policy options.
  Scope options override server options.
  Reservation options override scope options.

SCOPE FULL:
  Get-DhcpServerv4ScopeStatistics -ScopeId 10.0.1.0
  Shows: AddressesFree, AddressesInUse, PercentageInUse
  Fix: Expand range, shorten lease duration, or find stale leases</pre>

<h4>GUI walkthrough (what you'll see on assessment)</h4>
<pre>1. Open DHCP Management Console (dhcpmgmt.msc)
2. Expand server name > IPv4
3. Right-click IPv4 > New Scope (wizard walks you through)
4. Under the scope:
   - Address Pool: shows range and exclusions
   - Address Leases: shows who has what IP right now
   - Reservations: shows MAC-to-IP bindings
   - Scope Options: shows gateway, DNS, domain name
5. Right-click server > Authorize (if not already authorized)</pre>

<div class="interview-tip">Interview tip: "I configure DHCP with exclusion ranges for infrastructure devices, reservations for printers and servers that need consistent IPs, and scope options for DNS and gateway. For redundancy, I set up DHCP failover in load-balance mode between two servers. I always authorize in AD first - unauthorized DHCP servers won't serve leases, which is a security feature to prevent rogue DHCP."</div>
`

      id: 'ws-dns',
      title: 'Windows DNS Server - Zones, Records, Forwarders, Conditional Forwarding',
      content: `
<h4>What it is</h4>
<p>Windows DNS Server resolves hostnames to IP addresses (and vice versa). In Active Directory environments, DNS is required - AD literally cannot function without it. Domain controllers are almost always DNS servers too. Every domain join, login, and Group Policy lookup relies on DNS.</p>

<h4>Zone types</h4>
<pre>PRIMARY ZONE:
  Read/write copy of the zone. This server is authoritative.
  Changes are made here and replicated to secondary zones.

SECONDARY ZONE:
  Read-only copy. Pulls updates from the primary via zone transfer.
  Use for: redundancy, load distribution, branch offices.

AD-INTEGRATED ZONE (most common in enterprise):
  Zone data stored in Active Directory (not a flat file).
  Every DC with DNS role has a read/write copy.
  Replication uses AD replication (automatic, encrypted, multi-master).
  WHY THIS IS BEST: No single point of failure. Any DC can accept changes.
  Supports secure dynamic updates (only domain-joined machines can register).

STUB ZONE:
  Contains only NS and SOA records for a zone.
  Use for: pointing to another DNS server for a specific domain
  without doing a full zone transfer.

CONDITIONAL FORWARDER:
  "For queries about partner.com, ask 192.168.5.10"
  Use for: resolving partner/subsidiary domains, cross-forest trust resolution.
  Add-DnsServerConditionalForwarderZone -Name "partner.com" \`
    -MasterServers 192.168.5.10,192.168.5.11</pre>

<h4>DNS record types (must know cold)</h4>
<pre>RECORD    PURPOSE                           EXAMPLE
A         Hostname to IPv4                   server01 -> 10.0.1.50
AAAA      Hostname to IPv6                   server01 -> 2001:db8::50
CNAME     Alias to another name              mail -> exchange01.contoso.com
MX        Mail server for domain             contoso.com -> mail.contoso.com (priority 10)
PTR       IP to hostname (reverse lookup)    10.0.1.50 -> server01.contoso.com
SRV       Service location (AD uses these)   _ldap._tcp.contoso.com -> dc01 (port 389)
NS        Name server for zone               contoso.com -> dc01.contoso.com
SOA       Start of Authority (zone metadata) Serial number, refresh, retry, expire
TXT       Text record (SPF, DKIM, DMARC)     "v=spf1 include:spf.protection.outlook.com"</pre>

<h4>Step-by-step: Set up DNS on a new server</h4>
<pre>STEP 1: Install DNS role
  Install-WindowsFeature -Name DNS -IncludeManagementTools

STEP 2: Create a forward lookup zone
  Add-DnsServerPrimaryZone -Name "contoso.com" \`
    -ReplicationScope Domain \`
    -DynamicUpdate Secure

  -ReplicationScope Domain = replicate to all DCs in this domain
  -DynamicUpdate Secure = only domain-joined machines can auto-register

STEP 3: Create a reverse lookup zone
  Add-DnsServerPrimaryZone -NetworkId "10.0.1.0/24" \`
    -ReplicationScope Domain \`
    -DynamicUpdate Secure

  WHY: Enables PTR record lookups (IP to name). Needed for:
    - nslookup reverse queries
    - Some applications that verify connecting client names
    - Logging and audit trails

STEP 4: Add records
  # A record
  Add-DnsServerResourceRecordA -ZoneName "contoso.com" \`
    -Name "server01" -IPv4Address "10.0.1.50"

  # CNAME
  Add-DnsServerResourceRecordCName -ZoneName "contoso.com" \`
    -Name "intranet" -HostNameAlias "webserver01.contoso.com"

  # MX record
  Add-DnsServerResourceRecordMX -ZoneName "contoso.com" \`
    -Name "." -MailExchange "mail.contoso.com" -Preference 10

STEP 5: Configure forwarders (where to send queries you can't resolve)
  Set-DnsServerForwarder -IPAddress 8.8.8.8,8.8.4.4
  NOTE: In enterprise, forward to internal DNS first, then internet.</pre>

<h4>DNS troubleshooting commands</h4>
<pre># Check what DNS server a client is using
  ipconfig /all | findstr "DNS"

# Query a specific record
  nslookup server01.contoso.com
  nslookup -type=MX contoso.com
  nslookup -type=SRV _ldap._tcp.contoso.com

# Resolve-DnsName (PowerShell, more detailed)
  Resolve-DnsName -Name server01.contoso.com -Type A
  Resolve-DnsName -Name contoso.com -Type MX

# Clear DNS cache
  Clear-DnsClientCache          # Client-side
  Clear-DnsServerCache          # Server-side

# Check DNS server health
  Test-DnsServer -IPAddress 10.0.1.10 -ZoneName contoso.com

# See all records in a zone
  Get-DnsServerResourceRecord -ZoneName "contoso.com"

# Find specific record
  Get-DnsServerResourceRecord -ZoneName "contoso.com" -Name "server01"</pre>

<h4>AD-specific DNS records (SRV records)</h4>
<pre>Active Directory registers SRV records so clients can find:
  _ldap._tcp.contoso.com          - Domain controllers
  _kerberos._tcp.contoso.com      - Kerberos authentication
  _gc._tcp.contoso.com            - Global Catalog servers
  _ldap._tcp.sitename._sites...   - Site-specific DCs

If these are missing, clients can't find DCs.
Fix: Restart Netlogon service on the DC (re-registers SRV records)
  Restart-Service Netlogon

Or manually trigger:
  nltest /dsregdns</pre>

<div class="interview-tip">Interview tip: "I use AD-integrated DNS zones because they replicate with AD automatically, support secure dynamic updates, and eliminate single points of failure. For cross-forest resolution, I set up conditional forwarders. When troubleshooting DNS, I start with nslookup to verify resolution, check SRV records to ensure AD can locate domain controllers, and verify the forwarder chain if external resolution fails."</div>
`

      id: 'ws-rds-licensing',
      title: 'RDS Licensing - License Server Setup, CALs, Per-User vs Per-Device',
      content: `
<h4>What it is</h4>
<p>Remote Desktop Services (RDS) licensing controls who can connect to Windows Server via Remote Desktop. By default, Windows Server allows a 120-day grace period with 2 concurrent admin connections. Beyond that, you need RDS Client Access Licenses (CALs) and a license server. If you don't set this up, users get locked out after the grace period expires.</p>

<h4>Licensing modes (must know the difference)</h4>
<pre>PER-USER CAL:
  One license per user. That user can connect from any device.
  Best for: Users who connect from multiple devices (laptop, home PC, phone).
  Tracking: License server tracks which users have been issued a CAL.
  Advantage: Users roam freely across devices.

PER-DEVICE CAL:
  One license per device. Anyone can use that device to connect.
  Best for: Shared workstations, kiosks, call centers, shift workers.
  Tracking: License server tracks which devices have been issued a CAL.
  Advantage: Multiple users can share a device's license.

KEY DECISION:
  Count your users vs count your devices.
  More users than devices? Per-Device is cheaper.
  More devices than users? Per-User is cheaper.
  Most enterprises use Per-User because people have multiple devices.</pre>

<h4>Step-by-step: Set up RDS License Server</h4>
<pre>STEP 1: Install the RDS Licensing role
  Install-WindowsFeature -Name RDS-Licensing -IncludeManagementTools

  This installs the license server role and the RD Licensing Manager console.

STEP 2: Activate the license server
  Open: Remote Desktop Licensing Manager (licmgr.exe)
  Right-click server > Activate Server
  Choose connection method:
    - Automatic (internet) - server contacts Microsoft directly
    - Web Browser - if server has no internet, use another machine
    - Telephone - call Microsoft licensing center
  Enter your company info and agreement number.
  After activation, the server can issue temporary and permanent CALs.

STEP 3: Install CALs (Client Access Licenses)
  In RD Licensing Manager:
  Right-click server > Install Licenses
  Choose license program:
    - Enterprise Agreement
    - Open License
    - Select License
    - Service Provider License Agreement
    - Other
  Enter your agreement/authorization number.
  Select license type: Per User or Per Device.
  Enter quantity.
  Licenses appear in the console.

STEP 4: Point your RD Session Host to the license server
  This tells the server WHERE to get licenses.

  Via Group Policy (recommended for multiple servers):
    Computer Configuration > Administrative Templates >
    Windows Components > Remote Desktop Services >
    Remote Desktop Session Host > Licensing

    - "Use the specified Remote Desktop license servers"
      Set to: rdlic01.contoso.com (your license server FQDN)

    - "Set the Remote Desktop licensing mode"
      Set to: Per User or Per Device (must match your CALs)

  Via PowerShell:
    $obj = Get-WmiObject -Namespace "root/cimv2/TerminalServices" \`
      -Class Win32_TerminalServiceSetting
    $obj.SetSpecifiedLicenseServerList("rdlic01.contoso.com")
    $obj.ChangeMode(4)   # 4 = Per User, 2 = Per Device

STEP 5: Verify licensing is working
  In RD Licensing Diagnoser (built into Server Manager):
    Server Manager > Remote Desktop Services > RD Licensing Diagnoser
    Should show: "The licensing mode for the RD Session Host server is configured"
    and "License server is reachable"</pre>

<h4>Grace period and troubleshooting</h4>
<pre>THE 120-DAY GRACE PERIOD:
  After installing the RD Session Host role, you have 120 days
  before licensing enforcement kicks in.
  After grace period expires WITHOUT a license server configured:
    - Users see "No Remote Desktop License Server available"
    - They get disconnected or can't connect at all.
    - Only 2 admin RDP sessions remain (mstsc /admin)

CHECK GRACE PERIOD REMAINING:
  # Days remaining in grace period
  (Invoke-WmiMethod -Path 'Win32_TerminalServiceSetting' \`
    -Namespace root/cimv2/TerminalServices \`
    -Name GetGracePeriodDays).DaysLeft

COMMON ISSUES:
  "No license server available":
    1. Is the license server role installed? Get-WindowsFeature RDS-Licensing
    2. Is the license server activated? Check RD Licensing Manager
    3. Is the GPO pointing to the right server? rsop.msc on the session host
    4. Can the session host reach the license server? Test-NetConnection rdlic01 -Port 135
    5. Is Windows Firewall blocking? RPC (135) + dynamic ports must be open
    6. Is the license server in the same AD forest? Cross-forest requires trust + DNS

  "License mode mismatch":
    The GPO says Per-User but you installed Per-Device CALs (or vice versa).
    Fix: Match the GPO setting to the CAL type you purchased.

  "Not enough CALs":
    Get-WmiObject Win32_TSLicenseKeyPack -Namespace root/cimv2
    Check TotalLicenses vs IssuedLicenses. Buy more if needed.</pre>

<h4>Network license server (application licensing)</h4>
<pre>Some enterprise applications use a NETWORK LICENSE SERVER model.
This is different from RDS licensing but uses the same concept:

HOW IT WORKS:
  1. Install the vendor's license server software on a Windows Server
  2. Activate with your license file or product key
  3. Configure client applications to point to the license server
  4. License server tracks concurrent usage (e.g., 50 seats of AutoCAD)
  5. If all seats are in use, the next user gets "no license available"

COMMON EXAMPLES:
  - Autodesk License Manager (FlexLM/FlexNet) - AutoCAD, Revit, etc.
  - Adobe License Server - Creative Suite (legacy)
  - MATLAB License Manager
  - SolidWorks SolidNetwork License Manager

SETUP PATTERN (same for most vendors):
  1. Dedicate a server (can be a VM, low resource needs)
  2. Get the server's MAC address or hostname (license is tied to this)
  3. Request license file from vendor using this identifier
  4. Install license manager service
  5. Import/place license file in correct directory
  6. Start the license service
  7. Configure firewall to allow license port (varies by vendor)
     - FlexLM typically uses ports 27000-27009
     - Some vendors use custom ports
  8. Configure client software to point to license server
     Example: server=@licserver01.contoso.com or port@hostname

TROUBLESHOOTING:
  - "No license available" - check concurrent usage vs purchased seats
  - "Cannot connect to license server" - firewall, DNS, service not running
  - "License expired" - renew with vendor, update license file, restart service
  - Server rebuild - license is tied to MAC/hostname, contact vendor for rehost</pre>

<div class="interview-tip">Interview tip: "I've set up RDS licensing in Per-User mode for environments where users connect from multiple devices. The key steps are installing the licensing role, activating with Microsoft, installing CALs that match your licensing mode, and pointing session hosts via Group Policy. For application licensing like AutoCAD or MATLAB, I configure a dedicated license server with the vendor's FlexLM service and ensure the firewall allows the licensing port."</div>

      id: 'ws-file-print',
      title: 'File Server & Print Server - Shares, NTFS, DFS, Print Queues, GPO Deployment',
      content: `
<h4>What it is</h4>
<p>File servers host shared folders for departments. Print servers centralize printer management. Both are bread-and-butter Windows Server roles that every admin must know how to set up, permission, and troubleshoot.</p>

<h4>File shares - setting up a shared folder</h4>
<pre>STEP 1: Create the folder
  New-Item -Path "D:\\Shares\\Finance" -ItemType Directory

STEP 2: Share it on the network
  New-SmbShare -Name "Finance$" -Path "D:\\Shares\\Finance" \`
    -FullAccess "CONTOSO\\Finance-Admins" \`
    -ChangeAccess "CONTOSO\\Finance-Users" \`
    -ReadAccess "CONTOSO\\Domain Users"

  The $ makes it a HIDDEN share (doesn't show in network browse).
  Users access it by typing: \\\\fileserver01\\Finance$

TWO LAYERS OF PERMISSIONS (must understand both):
  SHARE PERMISSIONS (network access):
    - Full Control, Change, Read
    - Applied when accessing over the network
    - Best practice: Set share to "Everyone: Full Control"
      and control access through NTFS permissions

  NTFS PERMISSIONS (file system):
    - Full Control, Modify, Read & Execute, List, Read, Write
    - Applied whether accessed locally or over the network
    - This is where you do granular control
    - Inherited from parent folder by default

  THE RULE: When both apply, the MOST RESTRICTIVE wins.
    Share says: Full Control
    NTFS says: Read
    Result: User gets Read</pre>

<h4>NTFS permissions - PowerShell</h4>
<pre># View current permissions
  Get-Acl "D:\\Shares\\Finance" | Format-List

# Grant Modify to a group
  $acl = Get-Acl "D:\\Shares\\Finance"
  $rule = New-Object System.Security.AccessControl.FileSystemAccessRule(
    "CONTOSO\\Finance-Users","Modify","ContainerInherit,ObjectInherit","None","Allow")
  $acl.SetAccessRule($rule)
  Set-Acl "D:\\Shares\\Finance" $acl

# Remove inheritance and convert to explicit permissions
  $acl = Get-Acl "D:\\Shares\\Finance"
  $acl.SetAccessRuleProtection($true, $true)  # true = protect, true = copy inherited
  Set-Acl "D:\\Shares\\Finance" $acl</pre>

<h4>DFS (Distributed File System)</h4>
<pre>DFS NAMESPACES:
  Creates a virtual path that hides the actual server name.
  Users access: \\\\contoso.com\\shares\\finance
  Behind the scenes: mapped to \\\\fileserver01\\finance$
  WHY: If you move data to a new server, update the DFS target.
       Users never change their mapped drive. No disruption.

DFS REPLICATION (DFS-R):
  Replicates folders between servers automatically.
  Use for: Branch office file servers, DR copies, multi-site access.
  Uses RDC (Remote Differential Compression) - only syncs changed blocks.

SETUP:
  Install-WindowsFeature FS-DFS-Namespace, FS-DFS-Replication -IncludeManagementTools
  # Then configure in DFS Management console (dfsmgmt.msc)</pre>

<h4>Print Server</h4>
<pre>STEP 1: Install Print Services role
  Install-WindowsFeature Print-Services -IncludeManagementTools

STEP 2: Add a printer
  Open: Print Management console (printmanagement.msc)
  Expand: Print Servers > Your Server > Printers
  Right-click > Add Printer
  Choose:
    - TCP/IP: Enter printer IP address (e.g., 10.0.1.200)
    - Install driver: Use built-in or download from manufacturer

  PowerShell:
  # Add printer port
  Add-PrinterPort -Name "IP_10.0.1.200" -PrinterHostAddress "10.0.1.200"

  # Add printer driver
  Add-PrinterDriver -Name "HP Universal Printing PCL 6"

  # Add printer
  Add-Printer -Name "Finance-HP-Floor2" \`
    -DriverName "HP Universal Printing PCL 6" \`
    -PortName "IP_10.0.1.200" \`
    -Shared -ShareName "Finance-HP-Floor2" \`
    -Published   # Publishes to AD so users can search for it

STEP 3: Deploy printer via Group Policy
  Group Policy Management > Create/Edit GPO
  User Configuration > Preferences > Control Panel Settings > Printers
  Right-click > New > Shared Printer
  Share path: \\\\printserver01\\Finance-HP-Floor2
  Action: Create
  Set as default: Yes/No
  Targeting: Item-level targeting to specific OU, group, or IP range

  This auto-maps the printer for users at login. No manual setup needed.

STEP 4: Printer pooling (optional)
  Multiple identical printers behind a single queue.
  User sends to "Finance-Printer" and the job goes to whichever is available.
  Set up: Add multiple ports to one printer in printer properties.</pre>

<h4>Troubleshooting</h4>
<pre>FILE SHARE:
  "Access Denied" - Check NTFS permissions AND share permissions. Both must allow.
  "Network path not found" - DNS issue, server offline, or firewall blocking SMB (445).
  Test: Test-NetConnection fileserver01 -Port 445

PRINTER:
  "Printer offline" - Ping the printer IP. Check printer web interface.
  "Print spooler error" - Restart-Service Spooler
  "Jobs stuck in queue" - Stop spooler, clear C:\\Windows\\System32\\spool\\PRINTERS, start spooler
  "Driver mismatch" - Remove and reinstall printer driver. Use universal drivers when possible.</pre>

<div class="interview-tip">Interview tip: "I set share permissions to Everyone Full Control and manage all access through NTFS permissions for simplicity. I use DFS Namespaces so users connect to a domain-based path instead of a specific server name - that way I can migrate data without disrupting mapped drives. For printers, I deploy via Group Policy with item-level targeting so the right printers map to the right users based on their location or department."</div>
`

      id: 'ws-windows-firewall',
      title: 'Windows Firewall - Profiles, Rules, GPO Deployment, Troubleshooting',
      content: `
<h4>What it is</h4>
<p>Windows Defender Firewall with Advanced Security is the built-in host-based firewall on every Windows machine. It filters inbound and outbound traffic using rules. In enterprise, you manage firewall rules centrally through Group Policy.</p>

<h4>Three firewall profiles</h4>
<pre>DOMAIN PROFILE:
  Active when the computer is connected to its AD domain network.
  Typically the most permissive (trusted internal network).
  Applied when: Machine can reach a domain controller.

PRIVATE PROFILE:
  Active on networks marked as "private" (home, small office).
  Moderate restrictions.

PUBLIC PROFILE:
  Active on unknown/untrusted networks (coffee shop, hotel).
  Most restrictive. Blocks most inbound by default.

KEY: A server connected to the domain uses the Domain profile.
     If it can't reach a DC, it may fall to Public (very restrictive).
     This causes "works on the network, suddenly stops" issues.</pre>

<h4>Creating firewall rules</h4>
<pre># Allow inbound RDP (TCP 3389)
New-NetFirewallRule -DisplayName "Allow RDP" \`
  -Direction Inbound -Protocol TCP -LocalPort 3389 \`
  -Action Allow -Profile Domain

# Allow ICMP (ping)
New-NetFirewallRule -DisplayName "Allow Ping" \`
  -Direction Inbound -Protocol ICMPv4 -IcmpType 8 \`
  -Action Allow -Profile Domain,Private

# Allow SQL Server (TCP 1433)
New-NetFirewallRule -DisplayName "Allow SQL" \`
  -Direction Inbound -Protocol TCP -LocalPort 1433 \`
  -Action Allow -Profile Domain \`
  -RemoteAddress 10.0.1.0/24   # Only from this subnet

# Allow a program
New-NetFirewallRule -DisplayName "Allow MyApp" \`
  -Direction Inbound -Program "D:\\Apps\\MyApp.exe" \`
  -Action Allow -Profile Domain

# Block outbound to a specific IP
New-NetFirewallRule -DisplayName "Block Outbound" \`
  -Direction Outbound -RemoteAddress 203.0.113.50 \`
  -Action Block

# View all rules
Get-NetFirewallRule | Format-Table DisplayName, Enabled, Direction, Action

# Disable a rule
Disable-NetFirewallRule -DisplayName "Allow RDP"

# Remove a rule
Remove-NetFirewallRule -DisplayName "Allow RDP"</pre>

<h4>Deploy firewall rules via Group Policy</h4>
<pre>Group Policy Management > Edit GPO
Computer Configuration > Policies > Windows Settings >
  Security Settings > Windows Defender Firewall with Advanced Security

Inbound Rules > New Rule:
  Rule Type: Port (or Program, Custom)
  Protocol: TCP
  Ports: 3389
  Action: Allow the connection
  Profile: Domain (check/uncheck as needed)
  Name: "Allow RDP - Domain"

This pushes to all computers in the OU.
Result: gpupdate /force on clients to apply immediately.

BEST PRACTICE:
  - Manage firewall rules via GPO, not locally on each server
  - Use "Domain" profile for internal traffic
  - Log dropped packets for troubleshooting:
    Set-NetFirewallProfile -Profile Domain \`
      -LogAllowed False -LogBlocked True \`
      -LogFileName "C:\\Windows\\System32\\LogFiles\\Firewall\\pfirewall.log" \`
      -LogMaxSizeKilobytes 4096</pre>

<h4>Troubleshooting</h4>
<pre>1. CHECK WHICH PROFILE IS ACTIVE:
   Get-NetConnectionProfile
   If it says "Public" on a domain server, that's the problem.
   Fix: Restart NLA service, verify DC reachability, check DNS.

2. TEST IF FIREWALL IS BLOCKING:
   # Temporarily disable to test (re-enable immediately after!)
   Set-NetFirewallProfile -Profile Domain -Enabled False
   # If it works now, it's a firewall rule issue
   Set-NetFirewallProfile -Profile Domain -Enabled True

3. CHECK FIREWALL LOGS:
   Get-Content "C:\\Windows\\System32\\LogFiles\\Firewall\\pfirewall.log" -Tail 50

4. CHECK EFFECTIVE RULES:
   Get-NetFirewallRule -Enabled True -Direction Inbound |
     Get-NetFirewallPortFilter | Where-Object LocalPort -eq 443

5. TEST CONNECTIVITY:
   Test-NetConnection server01 -Port 443
   Test-NetConnection server01 -Port 3389</pre>

<div class="interview-tip">Interview tip: "I manage Windows Firewall rules centrally through Group Policy so every server gets consistent rules. I use the Domain profile for internal traffic and keep the Public profile restrictive as a safety net. When troubleshooting connectivity, I first check which firewall profile is active - if a domain server falls to the Public profile because it can't reach a DC, most inbound traffic gets blocked."</div>
`

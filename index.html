      id: 'ws-failover-clustering',
      title: 'Failover Clustering - Quorum, Shared Storage, Roles, Validation',
      content: `
<h4>What it is</h4>
<p>Failover clustering groups two or more servers (nodes) so that if one fails, the other automatically takes over. Used for critical services like SQL Server, file servers, Hyper-V, and DHCP. The cluster presents a single virtual name and IP - clients don't know or care which physical node is active.</p>

<h4>Key concepts</h4>
<pre>NODE: A server that is a member of the cluster (minimum 2).
ROLE: A service that runs on the cluster (e.g., SQL Server, File Server).
      The role "lives" on one node at a time and can move to another.
FAILOVER: When a role moves from a failed node to a healthy node.
FAILBACK: When a role moves back to the original node after it recovers.
HEARTBEAT: Network traffic between nodes to detect failures.
           If a node stops responding, the cluster moves the role.
CLUSTER NETWORK NAME (CNO): The virtual computer name for the cluster.
           Clients connect to this, not individual nodes.</pre>

<h4>Quorum - how the cluster decides who's in charge</h4>
<pre>Quorum prevents "split-brain" - where both nodes think they're primary.

QUORUM MODELS:
  NODE MAJORITY:
    More than half the nodes must be online. (3 nodes = need 2)
    Use for: 3+ node clusters.

  NODE AND DISK MAJORITY:
    Nodes + a shared "witness disk" vote. The disk gets a vote.
    Use for: 2-node clusters (2 nodes + 1 disk = 3 votes, need 2).

  NODE AND FILE SHARE MAJORITY:
    Nodes + a file share witness vote.
    Use for: Multi-site clusters where shared storage isn't possible.
    The witness share can be on any server (even in a 3rd site).

  CLOUD WITNESS (Azure):
    Uses an Azure Storage account as the witness.
    Best for: Stretched clusters, avoids needing a 3rd site.
    Set-ClusterQuorum -CloudWitness \`
      -AccountName "mywitness" -AccessKey "key..."

BEST PRACTICE FOR 2-NODE CLUSTER:
  Use File Share Witness or Cloud Witness.
  Without a witness, if one node dies, the other might not have quorum.</pre>

<h4>Step-by-step: Build a 2-node failover cluster</h4>
<pre>PREREQUISITES:
  - 2 servers, same hardware specs, same OS version, domain-joined
  - Shared storage (SAN via iSCSI or Fibre Channel, or Storage Spaces Direct)
  - At least 2 networks: one for client traffic, one for heartbeat
  - All nodes can resolve each other via DNS

STEP 1: Install Failover Clustering feature on both nodes
  Install-WindowsFeature Failover-Clustering -IncludeManagementTools

STEP 2: Validate the cluster configuration
  THIS IS REQUIRED. Microsoft won't support a cluster that wasn't validated.
  Test-Cluster -Node node01,node02

  This checks: storage, networking, system configuration, Hyper-V settings.
  Review the report. Fix all errors. Warnings are acceptable.

STEP 3: Create the cluster
  New-Cluster -Name "YOURCLUSTER" \`
    -Node node01,node02 \`
    -StaticAddress 10.0.1.100

  This creates:
    - The cluster object in AD (computer account)
    - The cluster IP address
    - Starts the cluster service on both nodes

STEP 4: Configure quorum
  # File share witness
  Set-ClusterQuorum -FileShareWitness "\\\\fileserver\\ClusterWitness"

  # Or Cloud Witness
  Set-ClusterQuorum -CloudWitness -AccountName "storageacct" -AccessKey "key"

STEP 5: Add storage (for traditional shared-disk clusters)
  # After presenting LUNs from SAN, add to cluster
  Get-ClusterAvailableDisk | Add-ClusterDisk

STEP 6: Create a clustered role (example: File Server)
  Add-ClusterFileServerRole -Name "YOURFS" \`
    -Storage "Cluster Disk 1" \`
    -StaticAddress 10.0.1.101

  Now clients connect to \\\\YOURFS\\sharename</pre>

<h4>Cluster management</h4>
<pre># View cluster nodes and status
  Get-ClusterNode
  Get-ClusterNode | Format-Table Name, State

# View clustered roles
  Get-ClusterGroup

# Move a role to another node (manual failover)
  Move-ClusterGroup -Name "YOURFS" -Node node02

# Take a node offline for maintenance
  Suspend-ClusterNode -Name node01 -Drain   # Moves all roles off first
  # Do maintenance...
  Resume-ClusterNode -Name node01

# View cluster events
  Get-ClusterLog -Destination C:\\Temp</pre>

<h4>Common clustered workloads</h4>
<pre>SQL Server Always On FCI:
  SQL instance runs on cluster. Shared disk for databases.
  If node fails, SQL service starts on other node. Same instance name.

Hyper-V (Live Migration):
  VMs can move between cluster nodes with zero downtime.
  Cluster Shared Volumes (CSV) store VM files on shared storage.

File Server:
  Scale-out File Server for Hyper-V/SQL workloads.
  General-use File Server for user data.

DHCP:
  Clustered DHCP for high availability of IP address assignment.</pre>

<div class="interview-tip">Interview tip: "I set up failover clusters with validation first - Test-Cluster is required and catches storage and network issues before they become production problems. For a two-node cluster, I always configure a cloud witness or file share witness for quorum. I use Suspend-ClusterNode with -Drain before maintenance so all roles gracefully move to the other node."</div>
`
    },

      id: 'ws-smtp-relay',
      title: 'SMTP Relay - Server Setup, Relay Restrictions, M365 Integration',
      content: `
<h4>What it is</h4>
<p>Many enterprise applications and devices (scanners, monitoring tools, line-of-business apps) need to send email but can't authenticate to Exchange/M365 directly. An SMTP relay server accepts email from internal sources and forwards it to your mail system. It acts as a middleman.</p>

<h4>Three ways to send email in an M365 environment</h4>
<pre>1. SMTP CLIENT SUBMISSION (most secure):
   Server: smtp.office365.com, Port 587, TLS required
   Requires: A licensed M365 mailbox + username/password or OAuth
   Use when: App supports modern auth or basic SMTP auth
   Limitation: Can only send as the authenticated user's address

2. DIRECT SEND (to M365 directly):
   Server: contoso-com.mail.protection.outlook.com, Port 25
   No auth needed, but can only send to internal recipients
   Use when: App sends to internal users only (monitoring alerts)
   Limitation: Cannot send to external recipients

3. SMTP RELAY via IIS or Windows SMTP (most flexible):
   Internal server accepts email on port 25 from apps/devices
   Relays through M365 or on-prem Exchange
   Use when: Devices can't do TLS/auth (older scanners, legacy apps)
   Can send to internal AND external recipients</pre>

<h4>Step-by-step: Set up SMTP relay on Windows Server (IIS SMTP)</h4>
<pre>STEP 1: Install IIS SMTP feature
  Install-WindowsFeature SMTP-Server -IncludeManagementTools
  # Also need IIS 6 Management tools
  Install-WindowsFeature Web-Mgmt-Compat

STEP 2: Configure SMTP in IIS 6.0 Manager
  Open: IIS 6.0 Manager (inetmgr6.exe) - NOT regular IIS Manager
  Expand: [SMTP Virtual Server #1]
  Right-click > Properties

  GENERAL TAB:
    IP Address: Set to server's internal IP (not "All Unassigned")
    Limit connections to: 1000 (or appropriate)

  ACCESS TAB:
    Authentication: Anonymous (internal devices can't authenticate)
    Connection: Only allow specific IP ranges (your subnet)
      Add: 10.0.0.0 / 255.0.0.0 (your internal network)
    Relay: Only allow specific IP ranges
      Add: 10.0.0.0 / 255.0.0.0
      CRITICAL: Uncheck "Allow all computers which successfully
                authenticate to relay" if using anonymous

  DELIVERY TAB:
    Advanced > Smart Host: smtp.office365.com
    (or your Exchange server: exchange01.contoso.com)
    Outbound Security: TLS enabled
    Port: 25 (or 587 for M365 with auth)

STEP 3: Configure M365 connector (if relaying through M365)
  In Exchange Admin Center > Mail Flow > Connectors:
    Create connector: From "Your organization's email server" to "Office 365"
    Authenticate by: IP address of your SMTP relay server
    Add the public IP of your relay server

STEP 4: Configure DNS (SPF record)
  Add your relay server's public IP to your SPF TXT record:
    v=spf1 ip4:YOUR.PUBLIC.IP include:spf.protection.outlook.com ~all
  WHY: Without this, emails relayed through your server may be marked spam

STEP 5: Test
  # From the relay server itself:
  Send-MailMessage -From "scanner@contoso.com" \`
    -To "admin@contoso.com" \`
    -Subject "Test Relay" \`
    -Body "Testing SMTP relay" \`
    -SmtpServer localhost

  # From a device on the network:
  telnet smtprelay01 25
  EHLO test
  MAIL FROM:<scanner@contoso.com>
  RCPT TO:<admin@contoso.com>
  DATA
  Subject: Test
  Test message
  .
  QUIT</pre>

<h4>Security: Relay restrictions (CRITICAL)</h4>
<pre>AN OPEN RELAY IS A SECURITY DISASTER.
  An open relay allows ANYONE on the internet to send email through your server.
  Your IP gets blacklisted within hours. All your email starts bouncing.

ALWAYS RESTRICT:
  1. Bind to internal IP only (not public-facing)
  2. Allow relay ONLY from known internal IP ranges
  3. Do not allow anonymous relay from the internet
  4. Use a firewall to block port 25 from external sources
  5. Monitor relay logs for abuse</pre>

<h4>Troubleshooting</h4>
<pre>"Emails not sending":
  1. Check SMTP service is running: Get-Service SMTPSVC
  2. Check queue: C:\\inetpub\\mailroot\\Queue (messages stuck here)
  3. Check badmail: C:\\inetpub\\mailroot\\Badmail (failed messages here)
  4. Check event logs: Event Viewer > Application
  5. Test connectivity to smart host: Test-NetConnection smtp.office365.com -Port 25
  6. Check relay restrictions (are you allowing the source IP?)

"Emails going to spam":
  1. Check SPF record includes your relay IP
  2. Check DKIM and DMARC records
  3. Check if your IP is blacklisted: mxtoolbox.com/blacklists</pre>

<div class="interview-tip">Interview tip: "I set up internal SMTP relay servers for legacy applications and multifunction scanners that can't authenticate to M365 directly. The relay accepts email from internal IPs only, forwards through a smart host to Exchange Online, and I always lock down relay restrictions to prevent open relay. The server's public IP is added to our SPF record so relayed messages pass email authentication checks."</div>
`
    },
    {
      id: 'ws-storage-disk',
      title: 'Storage & Disk Management - Volumes, RAID, Storage Spaces, iSCSI',
      content: `
<h4>What it is</h4>
<p>Storage management is knowing how to configure disks, create volumes, set up RAID for redundancy, and connect to network storage. On a technical assessment, you'll be asked to bring a new disk online, partition it, format it, and possibly set up a storage pool.</p>

<h4>Disk basics</h4>
<pre>MBR vs GPT:
  MBR (Master Boot Record): Legacy. Max 2TB per disk. Max 4 primary partitions.
  GPT (GUID Partition Table): Modern. Max 18 exabytes. 128 partitions.
  ALWAYS USE GPT for new disks. MBR only for legacy compatibility.

BASIC DISK vs DYNAMIC DISK:
  Basic: Standard partitions. Used by 99% of servers.
  Dynamic: Supports spanning, striping, mirroring across disks.
  Modern approach: Use Storage Spaces instead of dynamic disks.</pre>

<h4>Disk management - PowerShell (assessment ready)</h4>
<pre># List all disks
Get-Disk

# Initialize a new disk (raw disk just added)
Initialize-Disk -Number 1 -PartitionStyle GPT

# Create a partition using all available space
New-Partition -DiskNumber 1 -UseMaximumSize -AssignDriveLetter

# Format with NTFS
Format-Volume -DriveLetter E -FileSystem NTFS -NewFileSystemLabel "Data"

# One-liner: Initialize, partition, format
Get-Disk -Number 1 | Initialize-Disk -PartitionStyle GPT -PassThru |
  New-Partition -UseMaximumSize -AssignDriveLetter |
  Format-Volume -FileSystem NTFS -NewFileSystemLabel "Data"

# Extend a volume (after adding space to virtual disk)
$maxSize = (Get-PartitionSupportedSize -DriveLetter E).SizeMax
Resize-Partition -DriveLetter E -Size $maxSize

# Check disk space
Get-Volume | Format-Table DriveLetter, FileSystemLabel, Size, SizeRemaining</pre>

<h4>RAID levels (must know for assessment)</h4>
<pre>RAID 0 - STRIPING:
  Data spread across multiple disks. Fast reads/writes.
  NO REDUNDANCY. If one disk fails, all data is lost.
  Use: Temporary data, caches. Never for production.

RAID 1 - MIRRORING:
  Exact copy on two disks. If one fails, the other has all data.
  Cost: 50% capacity (2x 1TB disks = 1TB usable).
  Use: OS drives, boot volumes.

RAID 5 - STRIPING WITH PARITY:
  Data + parity spread across 3+ disks. Can survive one disk failure.
  Cost: Lose one disk worth of capacity (3x 1TB = 2TB usable).
  Use: General purpose file storage. Good read performance.

RAID 6 - DOUBLE PARITY:
  Like RAID 5 but can survive TWO disk failures.
  Cost: Lose two disks worth (4x 1TB = 2TB usable).
  Use: Large arrays where double failure is a real risk.

RAID 10 (1+0) - MIRROR + STRIPE:
  Mirrors pairs of disks, then stripes across the pairs.
  Fast reads/writes AND redundancy.
  Cost: 50% capacity (4x 1TB = 2TB usable).
  Use: Databases, high-performance workloads.</pre>

<h4>Storage Spaces (Windows Server built-in)</h4>
<pre>Storage Spaces is Microsoft's software-defined storage.
Pool physical disks together, then create virtual disks with resiliency.

CONCEPTS:
  STORAGE POOL: Group of physical disks managed as one unit.
  VIRTUAL DISK: Carved from the pool with a resiliency type.
  VOLUME: Formatted partition on the virtual disk.

RESILIENCY TYPES:
  Simple: No redundancy (like RAID 0). Performance only.
  Mirror: 2-way or 3-way mirror (like RAID 1).
  Parity: Distributed parity (like RAID 5/6). Space efficient.

SETUP:
# Create a storage pool from physical disks
$disks = Get-PhysicalDisk -CanPool $true
New-StoragePool -FriendlyName "DataPool" \`
  -StorageSubSystemFriendlyName "Windows*" \`
  -PhysicalDisks $disks

# Create a mirrored virtual disk
New-VirtualDisk -StoragePoolFriendlyName "DataPool" \`
  -FriendlyName "MirrorDisk" \`
  -ResiliencySettingName Mirror \`
  -Size 500GB

# Initialize, partition, and format
Get-VirtualDisk -FriendlyName "MirrorDisk" | Get-Disk |
  Initialize-Disk -PartitionStyle GPT -PassThru |
  New-Partition -UseMaximumSize -AssignDriveLetter |
  Format-Volume -FileSystem NTFS -NewFileSystemLabel "MirrorData"</pre>

<h4>iSCSI (network-attached storage)</h4>
<pre>iSCSI lets a server access SAN storage over the regular network (TCP).
The server sees the remote storage as a local disk.

TERMINOLOGY:
  TARGET: The storage device (SAN) presenting the disk.
  INITIATOR: The server connecting to the target.
  LUN: Logical Unit Number - a specific disk/volume on the target.
  IQN: iSCSI Qualified Name - unique identifier for initiator/target.

CONNECT TO iSCSI TARGET:
  # Start iSCSI service (must be running)
  Start-Service msiscsi
  Set-Service msiscsi -StartupType Automatic

  # Discover targets
  New-IscsiTargetPortal -TargetPortalAddress 10.0.2.100

  # Connect to target
  Connect-IscsiTarget -NodeAddress "iqn.2024.com.contoso:storage01"

  # The disk now appears in Get-Disk as a new disk
  # Initialize and format as normal

MULTIPATH (MPIO):
  For redundancy, connect to the same target via two network paths.
  Install-WindowsFeature Multipath-IO
  # Configure in MPIO control panel or mpclaim.exe</pre>

<div class="interview-tip">Interview tip: "For new disks, I initialize as GPT, create a partition, and format NTFS. For redundancy I use RAID 10 for databases and RAID 5/6 for file storage. On Windows Server, Storage Spaces provides software-defined mirroring and parity without a hardware RAID controller. For SAN connectivity, I configure the iSCSI initiator with multipath for redundancy so a single path failure doesn't lose storage access."</div>
`
    },
    {
      id: 'ws-perfmon-eventlog',
      title: 'Performance Monitor & Event Logs - Counters, Baselines, Data Collectors, Troubleshooting',
      content: `
<h4>What it is</h4>
<p>Performance Monitor (perfmon) and Event Viewer are the two primary troubleshooting tools on any Windows Server. Perfmon shows you real-time and historical performance data. Event Viewer shows you what happened, when, and why. On a technical assessment, you'll be asked to identify bottlenecks and find errors using these tools.</p>

<h4>Performance Monitor (perfmon.msc)</h4>
<pre>CRITICAL COUNTERS (memorize these):

CPU:
  Processor\\% Processor Time         Target: < 85% sustained
  System\\Processor Queue Length       Target: < 2x number of cores
  WHAT TO LOOK FOR: Consistently above threshold = CPU bottleneck

MEMORY:
  Memory\\Available MBytes             Target: > 20% of total RAM
  Memory\\Pages/sec                    Target: < 1000
  Memory\\% Committed Bytes In Use     Target: < 80%
  WHAT TO LOOK FOR: Low available memory + high pages/sec = paging to disk

DISK:
  PhysicalDisk\\Avg. Disk Queue Length  Target: < 2 per spindle
  PhysicalDisk\\% Disk Time            Target: < 85%
  PhysicalDisk\\Avg. Disk sec/Read     Target: < 15ms (HDD), < 5ms (SSD)
  PhysicalDisk\\Avg. Disk sec/Write    Target: < 15ms (HDD), < 5ms (SSD)
  WHAT TO LOOK FOR: High queue + high latency = disk bottleneck

NETWORK:
  Network Interface\\Bytes Total/sec   Compare to NIC speed
  Network Interface\\Output Queue Length Target: < 2
  WHAT TO LOOK FOR: Approaching NIC capacity = network bottleneck</pre>

<h4>Data Collector Sets (automated monitoring)</h4>
<pre>WHAT: Scheduled performance data collection. Runs in background,
      saves to files, can be analyzed later.

CREATE A BASELINE:
  # Create a data collector set
  Open perfmon > Data Collector Sets > User Defined
  Right-click > New > Data Collector Set
  Name: "Server Baseline"
  Create manually
  Add: Performance counters (the critical ones above)
  Schedule: Run for 24 hours during normal business day
  Save location: D:\\PerfLogs

  This gives you a BASELINE - what "normal" looks like.
  When something goes wrong, compare current metrics to baseline.

PowerShell:
  # Create a collector set
  $counters = @(
    "\\Processor(_Total)\\% Processor Time",
    "\\Memory\\Available MBytes",
    "\\PhysicalDisk(_Total)\\Avg. Disk Queue Length",
    "\\Network Interface(*)\\Bytes Total/sec"
  )
  # Use logman to create and start
  logman create counter "Baseline" -c $counters \`
    -si 15 -f bincirc -max 500 -o "D:\\PerfLogs\\Baseline"
  logman start "Baseline"

  # Stop after collection period
  logman stop "Baseline"</pre>

<h4>Event Viewer (eventvwr.msc)</h4>
<pre>KEY LOGS:
  Application    - App crashes, SQL errors, backup failures
  Security       - Logon success/failure, permission changes, audit events
  System         - Driver failures, service crashes, disk errors, NTP issues
  Setup          - Windows Update installation results

EVENT LEVELS:
  Critical       - System failure, data loss imminent
  Error          - Significant problem (service failed to start)
  Warning        - Potential problem (disk space low)
  Information    - Normal operation logged

IMPORTANT EVENT IDS TO KNOW:
  4624  - Successful logon (Security)
  4625  - Failed logon (Security) - brute force detection
  4740  - Account locked out (Security)
  1074  - System shutdown/restart initiated (System)
  6008  - Unexpected shutdown (System) - server crashed
  7036  - Service started/stopped (System)
  41    - Kernel power (unexpected reboot)
  1001  - Windows Error Reporting (Application)
  1102  - Audit log cleared (Security) - possible cover-up</pre>

<h4>PowerShell event log queries</h4>
<pre># Get recent errors from System log
Get-EventLog -LogName System -EntryType Error -Newest 20

# Get failed logons in the last 24 hours
Get-WinEvent -FilterHashtable @{
  LogName = 'Security'
  Id = 4625
  StartTime = (Get-Date).AddHours(-24)
}

# Get account lockouts
Get-WinEvent -FilterHashtable @{
  LogName = 'Security'
  Id = 4740
} | Select-Object TimeCreated, Message

# Get unexpected reboots
Get-WinEvent -FilterHashtable @{
  LogName = 'System'
  Id = 6008
}

# Export events to CSV for analysis
Get-WinEvent -FilterHashtable @{
  LogName = 'System'
  Level = 2  # Error
  StartTime = (Get-Date).AddDays(-7)
} | Export-Csv "C:\\Temp\\SystemErrors.csv" -NoTypeInformation

# Search for a specific string in events
Get-WinEvent -LogName Application |
  Where-Object { $_.Message -like "*SQL*" } |
  Select-Object TimeCreated, Id, Message -First 10</pre>

<h4>Quick troubleshooting workflow</h4>
<pre>SERVER IS SLOW - systematic approach:
  1. Task Manager (quick look): CPU? Memory? Disk?
  2. Resource Monitor (resmon): Which process is consuming?
  3. Perfmon: Detailed counters for the bottleneck area
  4. Event Viewer: Any errors correlated with the slowness?

  PowerShell quick checks:
    # Top CPU processes
    Get-Process | Sort-Object CPU -Descending | Select-Object -First 10

    # Memory usage
    Get-Process | Sort-Object WorkingSet64 -Descending |
      Select-Object Name, @{N='MB';E={[math]::Round($_.WorkingSet64/1MB)}} -First 10

    # Disk space
    Get-Volume | Where-Object DriveLetter | Format-Table DriveLetter, SizeRemaining, Size

    # Uptime (when was last reboot?)
    (Get-CimInstance Win32_OperatingSystem).LastBootUpTime</pre>

<div class="interview-tip">Interview tip: "When a server is slow, I follow a systematic approach: Task Manager for the quick overview, then Resource Monitor to identify the specific process, then Performance Monitor for detailed counters. I compare against baselines I've established using Data Collector Sets. For post-incident analysis, I correlate Event Viewer timestamps with performance data to identify root cause. The four key areas are CPU, memory, disk, and network - I check counters in that order."</div>
`

      id: 'ws-certificate-services',
      title: 'Certificate Services (AD CS) - Internal PKI, Templates, Auto-Enrollment',
      content: `
<h4>What it is</h4>
<p>Active Directory Certificate Services (AD CS) lets you run your own internal Certificate Authority (CA). Instead of buying certificates from a public CA for every internal service, you issue your own. Used for: internal websites (HTTPS), Wi-Fi authentication (802.1X), VPN certificates, code signing, email encryption (S/MIME), and smart card logon.</p>

<h4>PKI hierarchy</h4>
<pre>ROOT CA (offline, most secure):
  The trust anchor. Signs the subordinate CA's certificate.
  Should be: Offline, air-gapped, powered off. Only turned on to issue/renew sub-CA certs.
  WHY OFFLINE: If root CA is compromised, ALL certificates are untrusted.

SUBORDINATE/ISSUING CA (online, does the work):
  Issues certificates to users, computers, and services.
  Gets its own certificate from the root CA.
  This is the CA that's always running and serving requests.

SINGLE-TIER (just a root CA, no subordinate):
  Simpler. Used in small environments or labs.
  Risk: If compromised, everything is compromised, and you can't revoke it.

TWO-TIER (root + subordinate):
  Enterprise standard. Root is offline, subordinate issues certs.
  If subordinate is compromised, revoke its cert and build a new one.</pre>

<h4>Step-by-step: Set up Enterprise CA</h4>
<pre>STEP 1: Install AD CS role
  Install-WindowsFeature AD-Certificate -IncludeManagementTools

STEP 2: Configure CA (post-install wizard)
  Install-AdcsCertificationAuthority \`
    -CAType EnterpriseSubordinateCA \`
    -CACommonName "Contoso-Issuing-CA" \`
    -KeyLength 4096 \`
    -HashAlgorithmName SHA256 \`
    -ValidityPeriod Years \`
    -ValidityPeriodUnits 5

  CA TYPES:
    Enterprise CA: Integrated with AD. Can use templates. Auto-enrollment.
                   Must be on a domain-joined server.
    Standalone CA: Not AD-integrated. Manual approval. Used for root CA.

STEP 3: Configure certificate templates
  Open: Certificate Templates Console (certtmpl.msc)
  Templates define: What kind of cert, who can request, key size, validity.

  Common templates:
    Web Server        - HTTPS for internal websites
    Computer          - Machine authentication (802.1X, IPsec)
    User              - User authentication, email signing
    Domain Controller - DC authentication
    Code Signing      - Sign scripts and executables

  To customize: Duplicate an existing template, modify, then publish.
  Right-click template > Duplicate Template
  Change: Subject name, validity period, key size, permissions.

STEP 4: Publish templates
  Open: Certification Authority console (certsrv.msc)
  Expand: CA name > Certificate Templates
  Right-click > New > Certificate Template to Issue
  Select your template.

STEP 5: Auto-enrollment via Group Policy
  Computer Configuration > Policies > Windows Settings >
    Security Settings > Public Key Policies >
    Certificate Services Client - Auto-Enrollment
  Set to: Enabled
  Check: Renew expired certificates, update pending certificates

  This makes domain computers automatically request and renew certs.
  No manual process needed.</pre>

<h4>Common tasks</h4>
<pre># View issued certificates
  Get-ChildItem Cert:\\LocalMachine\\My

# Request a certificate manually
  # Open certlm.msc (Local Machine certificates)
  # Personal > Certificates > Right-click > Request New Certificate

# Revoke a certificate
  # In certsrv.msc > Issued Certificates > Right-click > Revoke

# Check CRL (Certificate Revocation List)
  certutil -verify -urlfetch servercert.cer

# Export a certificate
  $cert = Get-ChildItem Cert:\\LocalMachine\\My | Where-Object Subject -like "*webserver*"
  Export-Certificate -Cert $cert -FilePath "C:\\Certs\\webserver.cer"

# Check CA health
  certutil -ping</pre>

<h4>Troubleshooting</h4>
<pre>"Certificate not trusted":
  - Is the root CA cert in Trusted Root Certification Authorities?
  - Auto-distributed via Group Policy for Enterprise CAs
  - Manual import for standalone CAs or non-domain machines

"Auto-enrollment not working":
  1. Check GPO is applied: gpresult /r
  2. Check template permissions: Enroll + Autoenroll for target group
  3. Check template is published on the CA
  4. Run: certutil -pulse (force auto-enrollment check)

"Certificate expired":
  - Auto-enrollment should renew before expiry
  - Check template setting: "Renew when X% of validity has passed"
  - Manual renewal: certlm.msc > right-click cert > Renew</pre>

<div class="interview-tip">Interview tip: "I deploy a two-tier PKI with an offline root CA and an online Enterprise subordinate CA integrated with Active Directory. Certificate templates control what gets issued and to whom. I configure auto-enrollment via Group Policy so computers and users automatically get and renew certificates without manual intervention. This is how we enable internal HTTPS, 802.1X Wi-Fi authentication, and VPN certificate-based auth."</div>
`

      id: 'ws-gpo-deep-dive',
      title: 'Group Policy - Processing Order, Troubleshooting, Common Policies',
      content: `
<h4>What it is</h4>
<p>Group Policy Objects (GPOs) let you centrally manage settings for users and computers across your domain. From password policies to mapped drives to firewall rules to software installation - GPO is how enterprise Windows environments enforce configuration at scale.</p>

<h4>GPO processing order (LSDOU)</h4>
<pre>L - LOCAL policy   (gpedit.msc on the machine itself)
S - SITE policy     (AD site the computer is in)
D - DOMAIN policy   (applies to entire domain)
OU - OU policy      (organizational unit the object is in)

LAST ONE WINS. If Domain policy sets wallpaper to blue,
and OU policy sets wallpaper to red, the OU policy wins
because it processes last.

EXCEPTIONS:
  ENFORCED (No Override): A GPO marked "Enforced" cannot be
    overridden by child OUs. Domain-level enforced GPO always wins.
  BLOCK INHERITANCE: An OU can block all parent GPOs from applying.
    But Enforced GPOs still apply (Enforced beats Block).

SECURITY FILTERING:
  By default GPOs apply to "Authenticated Users".
  You can filter to specific groups:
    Remove "Authenticated Users" from Security Filtering
    Add your specific group (e.g., "Finance-Users")
    MUST also have "Domain Computers" with Read permission
    for computer-targeted settings to apply.</pre>

<h4>Must-know GPO settings</h4>
<pre>PASSWORD POLICY (Domain-level only):
  Computer Config > Policies > Windows Settings > Security Settings >
    Account Policies > Password Policy
    - Minimum length: 12+ characters
    - Complexity: Enabled (upper, lower, number, special)
    - Maximum age: 90 days
    - History: Remember 24 passwords

ACCOUNT LOCKOUT:
  Same path > Account Lockout Policy
    - Threshold: 5 invalid attempts
    - Duration: 30 minutes
    - Reset counter: 30 minutes

MAPPED DRIVES:
  User Config > Preferences > Windows Settings > Drive Maps
    Action: Create/Replace
    Location: \\\\fileserver\\finance$
    Drive Letter: F:
    Item-level targeting: Finance security group

SOFTWARE INSTALLATION:
  Computer Config > Policies > Software Settings > Software Installation
    Add .msi package from network share
    Assign = auto-install. Publish = available in Programs.

WINDOWS UPDATE:
  Computer Config > Administrative Templates >
    Windows Components > Windows Update
    Configure Automatic Updates: 4 - Auto download and schedule install
    Specify intranet update service: http://wsus01:8530

POWER/DISPLAY:
  Computer Config > Administrative Templates > System > Power Management
  User Config > Administrative Templates > Control Panel > Display

RESTRICT USB:
  Computer Config > Administrative Templates > System >
    Removable Storage Access > All Removable Storage: Deny All</pre>

<h4>Troubleshooting GPO</h4>
<pre># Force GPO refresh (don't wait for 90-minute cycle)
gpupdate /force

# See what GPOs are applied to this machine/user
gpresult /r              # Summary
gpresult /h report.html  # Detailed HTML report - BEST for troubleshooting

# Check specific policy settings via RSoP
rsop.msc                 # Resultant Set of Policy (GUI)

# From a DC, check GPO replication
Get-GPO -All | Select-Object DisplayName, GpoStatus, ModificationTime

# Check if GPO is linked to the right OU
Get-GPOReport -Name "Security-Baseline" -ReportType Html \`
  -Path "C:\\Temp\\gpo-report.html"

# Common issues:
"GPO not applying":
  1. Is the computer/user in the right OU? (Get-ADComputer/Get-ADUser)
  2. Is the GPO linked to that OU? (check GPMC)
  3. Security filtering - does the user/computer have Read + Apply?
  4. Is the GPO enabled? (check GpoStatus: AllSettingsEnabled)
  5. WMI filter blocking it? (check WMI filter on the GPO)
  6. Block Inheritance on the OU?
  7. Slow link detection? (if on VPN, some GPOs skip)

  GOLDEN RULE: Run gpresult /h on the problem machine.
  It shows EXACTLY which GPOs applied and which were denied and why.</pre>

<h4>GPO best practices</h4>
<pre>1. NEVER modify Default Domain Policy (except password/lockout)
2. NEVER modify Default Domain Controllers Policy (unless required)
3. Create separate GPOs by function:
   - "Security-Baseline" for security settings
   - "Drive-Maps-Finance" for department-specific mappings
   - "WSUS-Config" for update settings
4. Name GPOs descriptively (not "New GPO 1")
5. Document every GPO and what it does
6. Test in a TEST OU before applying to production
7. Use Group Policy Modeling (What-If) before linking:
   GPMC > Group Policy Modeling wizard</pre>

<div class="interview-tip">Interview tip: "I follow the principle of separation - one GPO per function, named descriptively, and tested in a test OU before production. When troubleshooting, I run gpresult /h on the affected machine to get the exact picture of what's applied and what's denied. The processing order is Local, Site, Domain, OU - last one wins unless the parent GPO is enforced."</div>
`

      id: 'ws-iis',
      title: 'IIS Web Server - Sites, Bindings, App Pools, SSL Certificates',
      content: `
<h4>What it is</h4>
<p>Internet Information Services (IIS) is the Windows web server. It hosts websites, web applications, and APIs. On a technical assessment, you'll set up a site, configure bindings (HTTP/HTTPS), set up an application pool, and bind an SSL certificate.</p>

<h4>Step-by-step: Install and configure IIS</h4>
<pre>STEP 1: Install IIS
  Install-WindowsFeature Web-Server -IncludeManagementTools

  This installs:
    - IIS web server
    - IIS Manager console (inetmgr)
    - Default website on port 80

STEP 2: Open IIS Manager
  Run: inetmgr
  You'll see: Server > Sites > Default Web Site

STEP 3: Create a new website
  # PowerShell
  New-WebSite -Name "IntranetApp" \`
    -PhysicalPath "D:\\WebApps\\IntranetApp" \`
    -Port 80 \`
    -HostHeader "intranet.contoso.com"

  # In IIS Manager: Right-click Sites > Add Website
  Site name: IntranetApp
  Physical path: D:\\WebApps\\IntranetApp
  Binding: HTTP, port 80, hostname: intranet.contoso.com</pre>

<h4>Application Pools</h4>
<pre>WHAT: An app pool is an isolated worker process (w3wp.exe).
      Each app pool runs independently. If one crashes, others are fine.

WHY THEY MATTER:
  - Isolation: Different apps don't affect each other
  - Identity: Each pool runs as a specific account (security boundary)
  - Recycling: Pools restart periodically to prevent memory leaks

# Create app pool
New-WebAppPool -Name "IntranetPool"

# Set identity (who the pool runs as)
Set-ItemProperty "IIS:\\AppPools\\IntranetPool" \`
  -Name processModel.identityType -Value SpecificUser
Set-ItemProperty "IIS:\\AppPools\\IntranetPool" \`
  -Name processModel.userName -Value "CONTOSO\\svc-intranet"
Set-ItemProperty "IIS:\\AppPools\\IntranetPool" \`
  -Name processModel.password -Value "P@ssw0rd"

# Assign pool to site
Set-ItemProperty "IIS:\\Sites\\IntranetApp" \`
  -Name applicationPool -Value "IntranetPool"

COMMON APP POOL IDENTITIES:
  ApplicationPoolIdentity (default): Virtual account. Least privilege.
  NetworkService: Legacy. Can access network resources.
  Specific User: Service account. Use when app needs domain permissions
                 (SQL access, file share access, etc.)

RECYCLING:
  Default: Recycles every 1740 minutes (29 hours).
  Custom: Set specific times (e.g., 3 AM nightly).
  Set-ItemProperty "IIS:\\AppPools\\IntranetPool" \`
    -Name recycling.periodicRestart.schedule -Value @{value="03:00:00"}</pre>

<h4>SSL/TLS certificate binding</h4>
<pre>STEP 1: Get a certificate
  Option A: Request from internal CA (AD CS)
    Open certlm.msc > Personal > Certificates > Request New Certificate
    Select "Web Server" template
    Fill in CN=intranet.contoso.com

  Option B: Import a .pfx file
    Import-PfxCertificate -FilePath "C:\\Certs\\intranet.pfx" \`
      -CertStoreLocation Cert:\\LocalMachine\\My \`
      -Password (ConvertTo-SecureString "certpass" -AsPlainText -Force)

STEP 2: Add HTTPS binding
  # Find certificate thumbprint
  Get-ChildItem Cert:\\LocalMachine\\My |
    Where-Object Subject -like "*intranet*" |
    Select-Object Thumbprint, Subject

  # Add HTTPS binding
  New-WebBinding -Name "IntranetApp" \`
    -Protocol https -Port 443 \`
    -HostHeader "intranet.contoso.com" \`
    -SslFlags 1   # 1 = SNI (Server Name Indication)

  # Bind the certificate
  $thumb = "AABBCC..."  # your cert thumbprint
  (Get-WebBinding -Name "IntranetApp" -Protocol https).AddSslCertificate($thumb, "My")

STEP 3: Force HTTPS redirect (optional)
  Install URL Rewrite module, then add rule:
  In IIS Manager > URL Rewrite > Add Rule > Blank Rule
    Condition: {HTTPS} = OFF
    Action: Redirect to https://{HTTP_HOST}{REQUEST_URI}
    Redirect type: 301 (Permanent)</pre>

<h4>Troubleshooting</h4>
<pre>"Site not loading":
  1. Is the app pool running? Get-WebAppPoolState -Name "IntranetPool"
  2. Start it: Start-WebAppPool -Name "IntranetPool"
  3. Check bindings: Get-WebBinding -Name "IntranetApp"
  4. Check physical path exists and IIS has read permission
  5. Check Event Viewer > Application for errors
  6. Check IIS logs: C:\\inetpub\\logs\\LogFiles\\W3SVC*

"503 Service Unavailable":
  App pool has crashed and stopped.
  Check Event Viewer for the crash reason.
  Start-WebAppPool "IntranetPool"
  If it keeps crashing: check app pool identity permissions,
  .NET version mismatch, or application errors.

"403 Forbidden":
  File permissions. The app pool identity needs Read access to the content folder.
  icacls "D:\\WebApps\\IntranetApp" /grant "IIS AppPool\\IntranetPool:(OI)(CI)R"

"Certificate errors":
  - Wrong cert bound? Check thumbprint matches
  - Cert expired? Check expiry date
  - Name mismatch? CN/SAN must match the URL
  - Not trusted? Root CA cert must be in Trusted Root store</pre>

<div class="interview-tip">Interview tip: "I set up each web application in its own app pool for isolation, running under a service account with least privilege. For HTTPS, I request certificates from our internal CA and bind them in IIS with SNI enabled so multiple HTTPS sites can share port 443. I configure IIS recycling at a fixed time during off-hours rather than the default interval to avoid recycling during business hours."</div>
`
    }
  ]
}
];

// App logic
let currentDomain = 0;
let completedTopics = JSON.parse(localStorage.getItem('skillpath_completed') || '{}');

function getStats() {
  let total = 0, complete = 0;
  DATA.forEach(d => { d.topics.forEach(t => { total++; if (completedTopics[t.id]) complete++; }); });
  return { total, complete, percent: total ? Math.round((complete/total)*100) : 0 };
}

function getDomainProgress(domain) {
  let total = domain.topics.length;
  let complete = domain.topics.filter(t => completedTopics[t.id]).length;
  return { total, complete, percent: total ? Math.round((complete/total)*100) : 0 };
}

function updateStats() {
  const s = getStats();
  document.getElementById('stat-total').textContent = s.total;
  document.getElementById('stat-complete').textContent = s.complete;
  document.getElementById('stat-percent').textContent = s.percent;
}

function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = DATA.map((d, i) => {
    const p = getDomainProgress(d);
    return `<div class="domain-item ${i === currentDomain ? 'active' : ''}" onclick="selectDomain(${i})">
      <div class="domain-name">${d.name}</div>
      <div class="domain-progress">${p.complete}/${p.total} topics</div>
      <div class="progress-bar"><div class="fill" style="width:${p.percent}%"></div></div>
    </div>`;
  }).join('');
}

function renderMain(filter) {
  const domain = DATA[currentDomain];
  const main = document.getElementById('main');
  let topics = domain.topics;
  if (filter) {
    topics = topics.filter(t => t.title.toLowerCase().includes(filter) || t.content.toLowerCase().includes(filter));
  }
  main.innerHTML = `
    <div class="domain-header">
      <h2>${domain.name}</h2>
      <p>${domain.desc}</p>
    </div>
    ${topics.map(t => `
      <div class="topic ${completedTopics[t.id] ? 'completed' : ''}" id="topic-${t.id}">
        <div class="topic-header" onclick="toggleTopic('${t.id}')">
          <div class="topic-check ${completedTopics[t.id] ? 'checked' : ''}" onclick="event.stopPropagation(); toggleComplete('${t.id}')"></div>
          <div class="topic-title">${t.title}</div>
          <div class="topic-expand">[+]</div>
        </div>
        <div class="topic-content" id="content-${t.id}">${t.content}</div>
      </div>
    `).join('')}
  `;
}

function selectDomain(i) {
  currentDomain = i;
  renderSidebar();
  renderMain();
}

function toggleTopic(id) {
  const el = document.getElementById('content-' + id);
  el.classList.toggle('open');
  const expand = el.previousElementSibling.querySelector('.topic-expand');
  expand.textContent = el.classList.contains('open') ? '[-]' : '[+]';
}

function toggleComplete(id) {
  completedTopics[id] = !completedTopics[id];
  localStorage.setItem('skillpath_completed', JSON.stringify(completedTopics));
  updateStats();
  renderSidebar();
  renderMain();
}

// Search
document.getElementById('search').addEventListener('input', function(e) {
  const q = e.target.value.toLowerCase().trim();
  if (!q) { renderMain(); return; }
  // Search across all domains
  const main = document.getElementById('main');
  let results = [];
  DATA.forEach((d, di) => {
    d.topics.forEach(t => {
      if (t.title.toLowerCase().includes(q) || t.content.toLowerCase().includes(q)) {
        results.push({ ...t, domainName: d.name, domainIndex: di });
      }
    });
  });
  main.innerHTML = `
    <div class="domain-header">
      <h2>Search: "${e.target.value}"</h2>
      <p>${results.length} results</p>
    </div>
    ${results.map(t => `
      <div class="topic ${completedTopics[t.id] ? 'completed' : ''}">
        <div class="topic-header" onclick="toggleTopic('${t.id}')">
          <div class="topic-check ${completedTopics[t.id] ? 'checked' : ''}" onclick="event.stopPropagation(); toggleComplete('${t.id}')"></div>
          <div class="topic-title"><span style="color:var(--dim)">${t.domainName} ></span> ${t.title}</div>
          <div class="topic-expand">[+]</div>
        </div>
        <div class="topic-content" id="content-${t.id}">${t.content}</div>
      </div>
    `).join('')}
  `;
});

// Keyboard shortcut
document.addEventListener('keydown', function(e) {
  if (e.key === '/' && e.target.tagName !== 'INPUT') {
    e.preventDefault();
    document.getElementById('search').focus();
  }
});

// Init
renderSidebar();
renderMain();
updateStats();
</script>
</body>
</html>

* { margin: 0; padding: 0; box-sizing: border-box; }
:root {

body {

  background: var(--bg);
  color: var(--fg);
  line-height: 1.6;
  min-height: 100vh;

a { color: var(--fg); }

/* Header */

  padding: 20px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;

.header h1 { font-size: 16px; font-weight: normal; }

.stats {

  gap: 20px;
  font-size: 13px;
  color: var(--dim);
}
.stats .num { color: var(--accent); }

.search-bar {
  padding: 15px 30px;
  border-bottom: 1px solid var(--border);
}
.search-bar input {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--fg);
  font-family: inherit;
  font-size: 14px;
  padding: 8px 12px;

  color: var(--dim);
}
.progress-bar {
  height: 2px;
  background: var(--border);
  margin-top: 6px;
  position: relative;
}
.progress-bar .fill {
  height: 100%;
  background: var(--fg);
  transition: width 0.3s;
}

.main {
  flex: 1;
  padding: 30px;
  overflow-y: auto;
  max-width: 900px;
}
.domain-header {
  margin-bottom: 30px;
  padding-bottom: 15px;

  height: 16px;
  border: 1px solid var(--dim);

  align-items: center;
  justify-content: center;

  font-size: 12px;

<h4>What it is</h4>
<p>Azure organizes everything in a strict hierarchy that controls billing, access, and policy inheritance.</p>

<h4>The hierarchy</h4>
<pre>Tenant (Entra ID)
  Management Groups (optional, for policy at scale)
    Subscriptions (billing boundary)
      Resource Groups (logical container)
        Resources (VMs, VNets, storage, etc.)</pre>

<h4>Why it matters</h4>
<ul>
<li>RBAC (permissions) inherit downward - assign at subscription, applies to all RGs below</li>
<li>Policies inherit downward - enforce naming conventions, allowed regions at management group level</li>
<li>Subscriptions are the billing boundary - separate prod/dev for cost tracking</li>
<li>Resource Groups are the lifecycle boundary - delete RG = delete everything inside</li>
</ul>

<h4>Real-world pattern</h4>
<pre>Tenant: contoso.onmicrosoft.com
  MG: Production
    Sub: Prod-Enterprise (IT infra)
      RG: rg-prod-identity (AD Connect, DCs)
      RG: rg-prod-networking (VNets, firewalls)
      RG: rg-prod-avd (virtual desktops)
    Sub: Prod-BusinessApps
      RG: rg-prod-erp
  MG: Non-Production
    Sub: Dev-Test
      RG: rg-dev-sandbox</pre>

<h4>Key commands</h4>
<pre>az account list --output table
az group list --output table
az group create --name rg-lab --location southcentralus
az group delete --name rg-lab --yes</pre>

<div class="interview-tip">Interview tip: "We organize resources by lifecycle and ownership. Each business unit gets their own resource group with Contributor access scoped only to that RG. This follows least privilege."</div>
`

<h4>What it is</h4>
<p>VNets are your private network in Azure. Nothing can communicate unless you explicitly allow it. Think of it as your office LAN but in the cloud.</p>

<h4>Key concepts</h4>
<ul>
<li><strong>VNet</strong> - address space (e.g., 10.0.0.0/16 = 65,536 IPs)</li>
<li><strong>Subnet</strong> - segment within VNet (e.g., 10.0.1.0/24 = 256 IPs)</li>
<li><strong>NSG</strong> - Network Security Group, firewall rules at subnet or NIC level</li>
<li><strong>Peering</strong> - connect two VNets (non-transitive by default)</li>
<li><strong>Service Endpoints</strong> - private path to Azure PaaS (Storage, SQL)</li>
<li><strong>Private Endpoints</strong> - private IP for Azure PaaS in your VNet</li>

<h4>Subnet design pattern (enterprise)</h4>
<pre>VNet: 10.0.0.0/16
  10.0.1.0/24  - GatewaySubnet (VPN/ExpressRoute)
  10.0.2.0/24  - AzureFirewallSubnet
  10.0.3.0/24  - servers-subnet (DCs, AD Connect)
  10.0.4.0/24  - avd-subnet (session hosts)
  10.0.5.0/24  - db-subnet (SQL, storage)

<h4>NSG rules (evaluated by priority, lowest number wins)</h4>

<p>Governance = controlling what people can do and enforcing standards. Two tools: RBAC (who can do what) and Azure Policy (what's allowed to exist).</p>

<h4>What it is</h4>
<p>Entra ID (formerly Azure AD) is Microsoft's cloud identity service. It is NOT "Active Directory in the cloud" - it's a completely different architecture.</p>

<h4>Key differences</h4>
<pre>Feature             On-Prem AD              Entra ID
Protocol            LDAP, Kerberos          OAuth 2.0, SAML, OIDC
Structure           Forests/Domains/OUs     Flat (tenant)
Group Policy        Yes (GPO)               No (use Intune)
Authentication      NTLM, Kerberos          Modern auth + tokens
Query               LDAP queries            Microsoft Graph API
Device management   Domain join + GPO       Entra join + Intune
DNS                 AD-integrated DNS       Azure DNS (separate)</pre>

<h4>Why both exist (hybrid)</h4>
<p>Most enterprises can't go full cloud overnight. Legacy apps need Kerberos/LDAP. File servers need NTLM. So you run both and sync identities between them. That's hybrid identity.</p>

<h4>Entra ID editions</h4>
<pre>Free     - basic user/group management, SSO (10 apps)
P1 (E3)  - Conditional Access, dynamic groups, SSPR writeback, app proxy
P2 (E5)  - Identity Protection, PIM, access reviews, entitlement management</pre>

<h4>Objects in Entra ID</h4>
<ul>
<li><strong>Users</strong> - cloud-only or synced from on-prem</li>
<li><strong>Groups</strong> - security or M365, assigned or dynamic</li>
<li><strong>Devices</strong> - Entra registered, Entra joined, hybrid Entra joined</li>
<li><strong>App registrations</strong> - your apps that use Entra for auth</li>
<li><strong>Enterprise apps</strong> - third-party apps (Salesforce, Zoom, etc.)</li>
<li><strong>Service principals</strong> - identity for apps/services (automation)</li>
</ul>

<div class="interview-tip">Interview tip: "The key distinction is that AD uses Kerberos and LDAP for on-prem resources, while Entra ID uses modern protocols like OAuth and SAML for cloud resources. In a hybrid environment, AD Connect bridges them by syncing identities and optionally passwords."</div>

<h4>User types</h4>
<ul>

<li><strong>Synced</strong> - created on-prem, synced via AD Connect. Source: "Windows Server AD". Managed on-prem.</li>

<h4>Group types</h4>
<pre>Type        Mail-enabled  Can contain             Use for

<h4>Assignment types</h4>
<ul>
<li><strong>Assigned</strong> - manually add/remove members. Simple but high maintenance.</li>
<li><strong>Dynamic User</strong> - membership based on user attributes. Auto-updates. Requires P1.</li>

</ul>

<h4>Dynamic group rules (memorize syntax)</h4>
<pre>// All users in IT department
user.department -eq "IT"

// All full-time employees (not guests)
(user.userType -eq "Member") -and (user.employeeType -eq "FullTime")

device.displayName -startsWith "CORP-"

(user.department -eq "Engineering") -and (user.jobTitle -contains "Senior")</pre>

<h4>Group-based licensing</h4>

<h4>Authentication methods (strongest to weakest)</h4>
<pre>Method                   Type            Phishing-resistant?
FIDO2 Security Key       Passwordless    Yes
Windows Hello (WHfB)     Passwordless    Yes
Certificate-based        Passwordless    Yes
Microsoft Authenticator  Passwordless    Partial (number matching helps)
Authenticator (push)     MFA             No (MFA fatigue attacks)
Phone/SMS               MFA             No (SIM swap attacks)
Password only           Single-factor   No</pre>

<h4>MFA - how it actually works</h4>
<p>User proves identity with 2+ of: something they know (password), something they have (phone/key), something they are (biometric).</p>

<h4>Where to configure MFA</h4>
<ul>
<li><strong>Security Defaults</strong> - free, forces MFA for all users. All or nothing. Good for small orgs.</li>
<li><strong>Conditional Access</strong> - granular, requires P1. Target specific users/apps/conditions. Enterprise standard.</li>
<li><strong>Per-user MFA</strong> - legacy method. DON'T use this. Hard to manage at scale.</li>
</ul>

<h4>Self-Service Password Reset (SSPR)</h4>
<ul>
<li>Users reset their own password without calling helpdesk</li>
<li>Requires: Entra ID P1 + authentication methods registered</li>
<li>Password writeback: writes the new password back to on-prem AD (requires AD Connect + P1)</li>
<li>Methods: Authenticator app, email, phone, security questions</li>
</ul>

<h4>Number matching (modern MFA)</h4>

<h4>Policy anatomy</h4>

<h4>What it is</h4>
<p>Microsoft Purview is the compliance and data governance platform. DLP (Data Loss Prevention) policies prevent sensitive data from leaving the organization.</p>

<h4>Purview components relevant to this role</h4>
<pre>Sensitivity Labels  - classify and protect documents/emails
DLP Policies        - detect and block sensitive data sharing
Retention Policies  - keep or delete data after time period
eDiscovery          - search and export for legal holds
Audit               - who did what, when (90 days E3, 1 year E5)</pre>

<h4>Sensitivity labels</h4>
<pre>Label taxonomy (typical enterprise):
  Public           - no protection, anyone can access
  Internal         - org-only, no external sharing
  Confidential     - encrypted, specific people/groups only
  Highly Confidential - encrypted, no forwarding, watermarked, tracked

What labels can do:
  - Encrypt content (only labeled recipients can open)
  - Add watermarks, headers, footers
  - Restrict access to specific users/groups
  - Prevent copy/paste, screenshots, forwarding
  - Auto-apply based on content (credit card numbers, SSN)</pre>

<h4>DLP policy anatomy</h4>
<pre>Locations: Exchange, SharePoint, OneDrive, Teams, Endpoints, Power BI
Conditions: Content contains sensitive info types (SSN, credit card, etc.)
Actions:
  - Block sharing externally
  - Show policy tip to user ("This contains sensitive data")
  - Require business justification to override
  - Notify admin/compliance team
  - Encrypt automatically</pre>

<h4>Common DLP scenarios</h4>
<pre>1. Block SSN/Tax ID sharing outside org
   Location: Exchange + SharePoint + Teams
   Condition: Content contains US SSN (confidence > 85%)
   Action: Block external sharing, notify user and compliance

2. Warn on financial data
   Location: All
   Condition: Content contains credit card numbers
   Action: Show warning, allow override with justification

3. Block sensitive files on USB (endpoint DLP)
   Location: Devices
   Condition: File has "Confidential" label
   Action: Block copy to USB/Bluetooth</pre>

<div class="interview-tip">Interview tip: "I'd implement DLP in phases - start with audit-only mode to see what sensitive data is being shared and where, then communicate to users about the upcoming policy, then enforce with user notifications and override options. Hard blocks from day one create user frustration and shadow IT workarounds."</div>

<h4>Error handling pattern</h4>
<pre>function Do-BulkOperation {
    param([string[]]$Users)

    $results = @()
    foreach ($user in $Users) {
        try {
            # Operation here
            $results += [PSCustomObject]@{User=$user; Status="Success"; Error=""}
        } catch {
            $results += [PSCustomObject]@{User=$user; Status="Failed"; Error=$_.Exception.Message}
            Write-Warning "Failed for $user : $_"
        }
    }

    # Summary
    $success = ($results | Where Status -eq "Success").Count
    $failed = ($results | Where Status -eq "Failed").Count
    Write-Host "Complete: $success success, $failed failed"

    # Export failures for review
    $results | Where Status -eq "Failed" | Export-Csv "failures.csv" -NoTypeInformation
    return $results
}</pre>

<h4>Logging pattern</h4>
<pre>$logFile = "C:\\Logs\\script_$(Get-Date -Format yyyyMMdd_HHmmss).log"

function Write-Log {
    param([string]$Message, [string]$Level = "INFO")
    $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
    $entry = "[$timestamp] [$Level] $Message"
    Add-Content -Path $logFile -Value $entry
    if ($Level -eq "ERROR") { Write-Host $entry -ForegroundColor Red }
    else { Write-Host $entry }
}

Write-Log "Script started"
Write-Log "Failed to process user" -Level "ERROR"</pre>

<h4>The playbook (memorize this order)</h4>
<pre>IMMEDIATE (within minutes):
1. Reset password
2. Revoke all sessions (Revoke-MgUserSignInSession)
3. Disable account if severity warrants

INVESTIGATE (within 1 hour):
4. Check sign-in logs - where did attacker sign in from?
5. Check inbox rules - forwarding to external? auto-delete?
6. Check OAuth app consents - malicious apps granted access?
7. Check mailbox delegates - added themselves as delegate?
8. Check sent items - did they phish internal users?

REMEDIATE:
9. Remove malicious inbox rules (Get-InboxRule | Remove-InboxRule)
10. Remove suspicious OAuth consents
11. Remove unknown delegates
12. Enable MFA if not already enabled
13. Force password change on next sign-in

PREVENT RECURRENCE:
14. Review Conditional Access gaps
15. Block legacy auth if not already
16. Add user to "high-risk" monitoring group
17. Document incident and lessons learned</pre>

<h4>Key PowerShell for incident response</h4>
<pre># Revoke all sessions
Revoke-MgUserSignInSession -UserId "compromised@domain.com"

# Check inbox rules (forwarding is #1 persistence method)
Connect-ExchangeOnline
Get-InboxRule -Mailbox "compromised@domain.com" |
  Where {$_.ForwardTo -or $_.RedirectTo -or $_.DeleteMessage} |
  Select Name, ForwardTo, RedirectTo, DeleteMessage

# Check OAuth app consents
Get-MgUserOauth2PermissionGrant -UserId "compromised@domain.com"

# Check sign-in logs
Get-MgAuditLogSignIn -Filter "userPrincipalName eq 'compromised@domain.com'" -Top 50 |
  Select CreatedDateTime, IpAddress, Location, Status</pre>

<h4>Common attack patterns</h4>
<pre>1. Phishing -> credential harvesting -> mailbox access
   Signs: impossible travel, inbox forwarding rules, mass email sent

2. Password spray -> single account compromised -> lateral movement
   Signs: many failed logins across accounts, then 1 success

3. OAuth consent phishing -> malicious app gets mail.read

4. MFA fatigue -> user approves push after repeated prompts

      content: `
<h4>What it is</h4>
<p>Azure Virtual Desktop (AVD) provides Windows desktops and apps running on Azure VMs. Users connect via client or browser. Microsoft manages the control plane; you manage the VMs.</p>

<h4>Architecture components</h4>
<pre>MICROSOFT MANAGED (control plane):
  - Web Access (gateway/broker)
  - Connection broker (routes users to session hosts)
  - Diagnostics
  - Load balancing

YOU MANAGE (data plane):
  - Host Pools (collection of session host VMs)
  - Session Hosts (Windows VMs users connect to)
  - Application Groups (what users see)
  - Workspaces (logical grouping for users)
  - Networking (VNet, NSG, connectivity to on-prem)
  - User profiles (FSLogix on Azure Files)</pre>

<h4>Key concepts</h4>
<pre>HOST POOL types:
  Pooled   - multiple users share VMs (most cost-effective)
           - load balanced: breadth-first or depth-first
  Personal - each user gets dedicated VM (persistent state)
           - use for developers, power users

APPLICATION GROUP types:
  Desktop  - full Windows desktop experience
  RemoteApp - individual published apps (just the app window, no desktop)

SESSION HOST OS:
  Windows 10/11 Multi-session - unique to AVD, multiple users on one Windows client OS
  Windows Server - traditional RDS multi-session</pre>

<h4>FSLogix profile containers</h4>
<pre>Problem: In pooled host pools, users land on different VMs each time.
         Their profile (settings, data) needs to follow them.

Solution: FSLogix stores user profile in a VHD on Azure Files.
          On login: VHD mounts -> profile loads -> user gets their settings
          On logoff: changes saved back to VHD

Storage: Azure Files with AD authentication
  - Standard tier for most users
  - Premium tier for heavy users (faster IOPS)
  - Recommend: separate file share per host pool</pre>

<h4>Scaling</h4>
<pre>Autoscale (built-in):
  - Ramp-up: start VMs before business hours
  - Peak: all VMs running, breadth-first balancing
  - Ramp-down: start draining sessions, deallocate empty VMs
  - Off-peak: minimum VMs running

Cost optimization:
  - Reserved Instances for base capacity (1yr or 3yr commit)
  - Start/Stop on schedule for dev/test pools
  - Use smaller VMs with more instances vs fewer large VMs</pre>

<h4>Networking for AVD</h4>
<pre>- Session hosts need line-of-sight to AD DC (for domain join)
- VNet peered or connected to on-prem (VPN/ExpressRoute)
- NSG: allow outbound to AVD service (service tag), block unnecessary inbound
- No public IPs on session hosts
- Users connect through AVD gateway (Microsoft-managed, internet-facing)</pre>

<div class="interview-tip">Interview tip: "I understand AVD architecture - host pools, session hosts, FSLogix on Azure Files, and the autoscale model. My practical experience is with physical Windows desktops and VMware-adjacent virtual environments. I can ramp quickly on AVD because the underlying Windows management, networking, and user profile concepts are the same - it's the delivery mechanism that's different."</div>
`

  topics: [
    {
      id: 'adm-what-is-domain-migration',
      title: 'What Is an AD Domain Migration (Big Picture)',
      content: `
<h4>What it is</h4>
<p>An Active Directory domain migration is the process of moving every identity - users, computers, groups, service accounts - from one AD domain (the <strong>source</strong>) to another AD domain (the <strong>target</strong>). Think of it like moving an entire company from one office building to another, where every keycard, every door lock, every security camera, and every employee badge has to be re-issued to work in the new building, while the company keeps operating during the move.</p>

<h4>Why companies do this</h4>
<ul>
<li><strong>Acquisition / Merger</strong> - Company A buys Company B. Both have AD domains. Consolidate into one.</li>
<li><strong>Domain consolidation</strong> - Company grew over 20 years, ended up with 5 domains. Simplify to 1.</li>
<li><strong>Rebranding</strong> - Company changes name. contoso.local becomes newname.local.</li>
<li><strong>Security remediation</strong> - Current domain was compromised. Build a clean domain and migrate into it.</li>
<li><strong>Technical debt</strong> - Domain was built on Server 2003 functional level. Easier to migrate than upgrade.</li>
</ul>

<h4>The two types of on-prem AD migration</h4>
<pre>INTRA-FOREST (same forest, restructure domains):
  Example: contoso.local\\corp and contoso.local\\branch -> contoso.local\\unified
  - Objects move within the same forest
  - Simpler because forest-level trusts already exist
  - SID History works natively

INTER-FOREST (different forests entirely):
  Example: contoso.local -> newcompany.local
  - Objects move between separate forests
  - Requires explicit trust relationship
  - More complex, more planning
  - This is what most large migrations are</pre>

<h4>What actually moves</h4>
<pre>IDENTITY OBJECTS:
  - User accounts (with passwords if using Quest/ADMT)
  - Computer accounts (workstations and servers)
  - Security groups (and their memberships)
  - Service accounts (accounts that applications use to run)
  - Group Managed Service Accounts (gMSAs)

CONFIGURATION:
  - Group Policy Objects (GPOs) - must be recreated/imported
  - Organizational Units (OUs) - must be recreated
  - DNS zones - may need migration or rebuild
  - Certificate templates - if using AD Certificate Services
  - Scheduled tasks running as domain accounts

DOES NOT MOVE AUTOMATICALLY:
  - Applications (they need remediation)
  - SQL Server logins and permissions
  - File share permissions (they reference old SIDs)
  - Printer permissions
  - Hard-coded domain references in scripts and configs</pre>

<h4>Key terms you must know</h4>
<pre>SID (Security Identifier):
  Every object in AD has a unique SID. Example: S-1-5-21-3623811015-3361044348-30300820-1013
  When you access a file share, Windows checks your SID against the ACL (access list).
  When you migrate a user, they get a NEW SID in the target domain.
  Problem: all the old permissions reference the OLD SID.

SID History:
  A special attribute that stores the user's OLD SID(s) on their new account.
  When the migrated user accesses old resources, Windows checks both the new SID AND SID History.
  This is how users keep access to resources during migration - the bridge between old and new.

Trust Relationship:

  For migration: you need at least a one-way trust (target trusts source).

ADMT (Active Directory Migration Tool):

Quest Migration Manager for AD:

      id: 'adm-dependency-mapping',
      title: 'Application Dependency Mapping',
      content: `
<h4>What it is</h4>
<p>Before you migrate anything, you need to know what will break. Dependency mapping is the process of finding every place where an application touches the source domain - service accounts, group memberships, SPNs, DNS names, certificates, hard-coded paths. If you miss one, the application breaks after migration.</p>

<h4>Why this is the most critical step</h4>
<p>Migrating the user accounts is the easy part. The hard part is that applications are wired into AD in dozens of hidden ways. A service running as SOURCEDOMAIN\\svc_app won't start after migration because that account no longer exists in the source domain (or was migrated to TARGETDOMAIN\\svc_app and the service config wasn't updated).</p>

<h4>What to inventory for every application</h4>
<pre>IDENTITY BINDINGS (how the app authenticates):
  Service Accounts:
    - What domain account does the Windows service run as?
    - Command: Get-WmiObject Win32_Service | Select Name, StartName
    - Look for: SOURCEDOMAIN\\svc_*, any domain account that's not LocalSystem

  Scheduled Tasks:
    - What account do scheduled tasks run as?
    - Command: Get-ScheduledTask | Select TaskName, Principal
    - Look for: SOURCEDOMAIN\\* in the "Run As" field

  Application Pools (IIS):
    - What identity does each IIS app pool use?
    - Command: Get-IISAppPool | Select Name, ProcessModel.IdentityType
    - Look for: domain accounts instead of ApplicationPoolIdentity

  COM+ Applications:
    - What identity do COM+ apps run under?
    - Check via Component Services > COM+ Applications > Properties > Identity

  SQL Server Service Account:
    - SQL Server engine, agent, and SSRS all run as service accounts
    - Check: SQL Server Configuration Manager > Services

GROUP MEMBERSHIPS (what access the app needs):
  - What AD groups does the service account belong to?
  - What AD groups control user access to the app?
  - Are there nested groups? (Group A contains Group B which contains users)
  - Command: Get-ADPrincipalGroupMembership -Identity svc_appname

NETWORK IDENTITY (how the app is found):
  SPNs (Service Principal Names):
    - What: A unique identifier that ties a service to an account for Kerberos auth
    - Example: MSSQLSvc/sqlserver01.source.local:1433
    - If the SPN references the old domain, Kerberos auth breaks
    - Command: setspn -L SOURCEDOMAIN\\svc_sqlserver
    - Command: Get-ADUser svc_sqlserver -Properties servicePrincipalName

  DNS Records:
    - Does the app use DNS names tied to the source domain?
    - Example: app.source.local -> needs to become app.target.local
    - Or: keep old DNS as CNAME pointing to new

  Certificates:
    - Does the app use SSL/TLS certs with the old domain name in the SAN?
    - Example: CN=app.source.local - needs new cert for target domain

HARD-CODED REFERENCES (the hidden landmines):
  - Connection strings: "Data Source=sqlserver.source.local"
  - Config files: LDAP://source.local/OU=Users
  - Registry entries with domain paths
  - Scripts with domain names or UNC paths (\\\\source.local\\share)
  - Application databases storing domain\\username format</pre>

<h4>Discovery process (step by step)</h4>
<pre>Step 1: Get application inventory from CMDB or app owners
  "Give me every application running in this environment"

Step 2: For each application, document:
  [ ] Application name and owner
  [ ] Server(s) it runs on
  [ ] Service account(s) used
  [ ] Scheduled tasks
  [ ] SPNs registered
  [ ] AD groups for access control
  [ ] SQL databases it connects to
  [ ] DNS names it uses
  [ ] Certificates installed
  [ ] Config files with domain references

Step 3: Run Quest Resource Processing or manual scripts:
  # Find all services running as domain accounts on a server
  Invoke-Command -ComputerName SERVER01 -ScriptBlock {
    Get-WmiObject Win32_Service |
    Where-Object { $_.StartName -like "SOURCEDOMAIN*" } |
    Select Name, DisplayName, StartName, State
  }

  # Find all scheduled tasks running as domain accounts
  Invoke-Command -ComputerName SERVER01 -ScriptBlock {
    Get-ScheduledTask |
    Where-Object { $_.Principal.UserId -like "SOURCEDOMAIN*" } |
    Select TaskName, @{N='RunAs';E={$_.Principal.UserId}}
  }

  # Find all SPNs in the domain
  Get-ADUser -Filter {servicePrincipalName -like "*"} -Properties servicePrincipalName |
  Select Name, @{N='SPNs';E={$_.servicePrincipalName -join "; "}}

Step 4: Classify each app by migration approach:
  CLONE  - rebuild in target domain (cleanest, most work)
  REMEDIATE - update identity bindings in place (most common)
  IN-PLACE - update service accounts, keep app on same server</pre>

<h4>Output: The dependency matrix</h4>
<pre>| App        | Server    | Svc Account          | SPNs | Groups           | SQL DB    | Approach   |
|------------|-----------|----------------------|------|------------------|-----------|------------|
| ERP System | APP-SRV01 | SRC\\svc_erp          | 2    | GRP-ERP-Users    | ERP_Prod  | Remediate  |
| HR Portal  | WEB-SRV01 | SRC\\svc_hrweb        | 1    | GRP-HR-Access    | HR_DB     | Remediate  |
| FileServer | FS-SRV01  | LocalSystem          | 0    | GRP-FS-Admins    | N/A       | Re-ACL     |
| Legacy App | APP-SRV02 | SRC\\svc_legacy       | 0    | GRP-Legacy-Users | Legacy_DB | Clone      |</pre>

<div class="interview-tip">Interview tip: "Dependency mapping is where migrations succeed or fail. I build a matrix for every application: what service accounts it uses, what SPNs are registered, what AD groups control access, and what SQL databases it connects to. Then I classify each app as clone, remediate, or in-place. This matrix becomes the migration runbook for the app team."</div>
`

      id: 'adm-service-accounts-spns',
      title: 'Service Accounts, SPNs & Identity Bindings (Deep Dive)',
      content: `
<h4>What is a service account</h4>
<p>A service account is an AD user account that an application or Windows service uses to run and authenticate - instead of a human logging in. When you see a Windows service running as DOMAIN\\svc_sqlserver instead of "Local System", that's a service account. It has a username and password stored in AD just like a person, but no human ever logs into it interactively.</p>

<h4>Types of service accounts</h4>
<pre>STANDARD DOMAIN USER (legacy, most common in old environments):
  What: Regular AD user account used as service identity
  Example: SOURCEDOMAIN\\svc_appname
  Password: Set manually, often never changed (security risk)
  Problem in migration: Must be recreated in target domain, every service
    using it must be updated to TARGETDOMAIN\\svc_appname

MANAGED SERVICE ACCOUNT (MSA):
  What: AD account whose password is automatically managed by AD
  Limitation: Can only be used on ONE server
  Example: SOURCEDOMAIN\\svc_app$ (note the $ suffix)
  Problem in migration: Must be recreated in target, server re-associated

GROUP MANAGED SERVICE ACCOUNT (gMSA):
  What: Like MSA but can be used across MULTIPLE servers
  Password: Auto-rotated by AD every 30 days, retrieved by authorized servers
  Example: SOURCEDOMAIN\\gmsa_app$
  Best practice: Use these for all new deployments
  Problem in migration: Must be recreated in target domain,
    all servers must be authorized in target to retrieve the password</pre>

<h4>What is an SPN (Service Principal Name)</h4>
<p>An SPN is a unique name that identifies a service instance to Kerberos authentication. When a client wants to connect to a SQL server using Windows authentication (Kerberos), it asks AD: "Give me a Kerberos ticket for the service named MSSQLSvc/sqlserver01.source.local:1433." AD looks up which account has that SPN registered and issues the ticket. If the SPN is wrong, missing, or duplicated - Kerberos fails and the connection falls back to NTLM (slower, less secure) or fails entirely.</p>

<h4>SPN format</h4>
<pre>ServiceClass/Host:Port
  ServiceClass = type of service (MSSQLSvc, HTTP, HOST, etc.)
  Host = server name (FQDN or NetBIOS)
  Port = optional port number

Common SPNs:
  MSSQLSvc/sqlserver01.source.local:1433    - SQL Server
  MSSQLSvc/sqlserver01.source.local         - SQL Server (default instance)
  HTTP/webapp01.source.local                - IIS web application
  HTTP/portal.source.local                  - Web portal (may use host header)
  HOST/server01.source.local                - General computer identity</pre>

<h4>Why SPNs break during migration</h4>
<pre>BEFORE MIGRATION:
  Account: SOURCEDOMAIN\\svc_sql
  SPN: MSSQLSvc/sqlserver01.source.local:1433
  Kerberos flow: Client -> AD -> "svc_sql has that SPN" -> ticket issued -> works

AFTER MIGRATION (if not remediated):
  Account migrated to: TARGETDOMAIN\\svc_sql (new SID, new domain)
  Old SPN still registered on SOURCEDOMAIN\\svc_sql
  New account has NO SPN registered
  Kerberos flow: Client -> AD -> "nobody has that SPN" -> FAIL

FIX:
  1. Remove SPN from old account: setspn -D MSSQLSvc/sqlserver01.source.local:1433 SOURCEDOMAIN\\svc_sql
  2. Register SPN on new account: setspn -S MSSQLSvc/sqlserver01.target.local:1433 TARGETDOMAIN\\svc_sql
  3. If server keeps old DNS name: setspn -S MSSQLSvc/sqlserver01.source.local:1433 TARGETDOMAIN\\svc_sql</pre>

<h4>Migration remediation for service accounts (step by step)</h4>
<pre>FOR EACH SERVICE ACCOUNT:

Step 1: Document current state
  Get-ADUser svc_appname -Properties servicePrincipalName, MemberOf |
  Select Name, SamAccountName, servicePrincipalName, MemberOf

Step 2: Create matching account in target domain
  - Same name (svc_appname)
  - Same password (or new one - will update all services)
  - Same group memberships (recreated in target domain)

Step 3: Register SPNs on new account
  setspn -S MSSQLSvc/server01.target.local:1433 TARGETDOMAIN\\svc_appname

Step 4: Update every service that uses this account
  # Update Windows service
  sc.exe \\\\SERVER01 config "ServiceName" obj= "TARGETDOMAIN\\svc_appname" password= "P@ssw0rd"

  # Update scheduled task
  schtasks /Change /S SERVER01 /TN "TaskName" /RU "TARGETDOMAIN\\svc_appname" /RP "P@ssw0rd"

  # Update IIS App Pool
  Set-WebConfigurationProperty -PSPath 'IIS:\\' \\
    -Filter "system.applicationHost/applicationPools/add[@name='AppPoolName']/processModel" \\
    -Name "userName" -Value "TARGETDOMAIN\\svc_appname"

Step 5: Test authentication
  - Restart the service
  - Verify it starts successfully
  - Verify Kerberos tickets are issued (klist on client)
  - Verify application functionality end-to-end

Step 6: Document the change
  - What was changed
  - Old value -> New value
  - Test result
  - Rollback steps (revert to old account if needed)</pre>

<h4>Common SPN problems and how to fix them</h4>
<pre>DUPLICATE SPN (most common):
  Symptom: Kerberos fails intermittently
  Cause: Same SPN registered on two different accounts
  Find: setspn -X (searches entire forest for duplicates)
  Fix: Remove the incorrect one with setspn -D

MISSING SPN:
  Symptom: App falls back to NTLM or connection fails
  Cause: SPN was never registered, or lost during migration
  Find: setspn -L accountname (list SPNs for account)
  Fix: setspn -S ServiceClass/hostname DOMAIN\\account

WRONG ACCOUNT:
  Symptom: "Cannot generate SSPI context" error in SQL
  Cause: SPN registered on wrong account (e.g., computer account vs service account)
  Find: setspn -Q MSSQLSvc/servername (shows which account has it)
  Fix: Remove from wrong account, add to correct one</pre>

<div class="interview-tip">Interview tip: "Service accounts and SPNs are where I spend the most time in migration remediation. I start by exporting every SPN in the source domain and mapping them to service accounts. Then for each application, I document the full identity chain: what account runs the service, what SPNs it needs, what groups it belongs to. During cutover, I have a checklist: create account, register SPNs, update service config, restart, validate Kerberos with klist."</div>
`
    },
    {
      id: 'adm-sql-migration',
      title: 'SQL Server Migration for Domain Migration',
      content: `
<h4>What it is</h4>
<p>When you migrate AD domains, SQL Server is one of the most complex applications to remediate because it has its own layer of identity management. SQL Server has logins (who can connect), users (who can access databases), and roles (what they can do). Many of these are tied to the source domain. If you don't update them, nobody can access the database after migration.</p>

<h4>SQL Server identity layers (understand this hierarchy)</h4>
<pre>LAYER 1: WINDOWS SERVICE ACCOUNT
  SQL Server itself runs as a Windows service.
  The service runs under a domain account: SOURCEDOMAIN\\svc_sql
  This account needs:
    - Local admin on the SQL server (or specific SQL permissions)
    - SPNs registered for Kerberos
    - Permissions to the data/log file directories
  MIGRATION IMPACT: Must update to TARGETDOMAIN\\svc_sql

LAYER 2: SQL SERVER LOGINS (instance-level)
  Logins are how users/apps CONNECT to SQL Server.
  Two types:
    - Windows login: SOURCEDOMAIN\\jsmith (uses AD credentials)
    - SQL login: sa, appuser (uses SQL username/password, NOT affected by domain migration)
  MIGRATION IMPACT: Every Windows login referencing SOURCEDOMAIN must be
    recreated as TARGETDOMAIN\\username or TARGETDOMAIN\\groupname

LAYER 3: DATABASE USERS (database-level)
  Each database has users mapped to logins.
  Login SOURCEDOMAIN\\jsmith -> mapped to database user "jsmith" in AppDB
  MIGRATION IMPACT: After recreating the login as TARGETDOMAIN\\jsmith,
    the database user must be re-mapped to the new login.

LAYER 4: DATABASE ROLES & PERMISSIONS
  Users are assigned to database roles: db_datareader, db_datawriter, db_owner, or custom roles.
  MIGRATION IMPACT: Permissions should survive if user mapping is done correctly.
  But verify - don't assume.</pre>

<h4>SQL Server migration steps (step by step)</h4>
<pre>BEFORE MIGRATION (Assessment):

Step 1: Inventory all SQL instances
  # Find SQL instances on network (requires SQL discovery or CMDB)
  Get-Service -ComputerName SERVER01 | Where { $_.Name -like "MSSQL*" }

Step 2: Document SQL service accounts
  # Check SQL Server Configuration Manager or:
  Get-WmiObject Win32_Service -ComputerName SQLSERVER01 |
  Where { $_.Name -like "MSSQL*" -or $_.Name -like "SQLAgent*" -or $_.Name -like "ReportServer*" } |
  Select Name, StartName, State

Step 3: Export all Windows logins from each instance
  -- Run in SQL Server Management Studio (SSMS) or sqlcmd:
  SELECT sp.name AS LoginName,
         sp.type_desc AS LoginType,
         sp.default_database_name,
         sp.is_disabled
  FROM sys.server_principals sp
  WHERE sp.type IN ('U', 'G')  -- U = Windows user, G = Windows group
  AND sp.name LIKE 'SOURCEDOMAIN%'
  ORDER BY sp.name

Step 4: For each database, document user-to-login mappings
  USE [AppDatabase]
  SELECT dp.name AS DatabaseUser,
         dp.type_desc,
         sp.name AS LoginName
  FROM sys.database_principals dp
  LEFT JOIN sys.server_principals sp ON dp.sid = sp.sid
  WHERE dp.type IN ('U', 'G', 'S')
  AND dp.name != 'dbo'

Step 5: Document SPNs for SQL Server
  setspn -L SOURCEDOMAIN\\svc_sql</pre>

<pre>DURING MIGRATION (Execution):

Step 6: Create new SQL service account in target domain
  TARGETDOMAIN\\svc_sql with same permissions

Step 7: Register SPNs on new account
  setspn -S MSSQLSvc/sqlserver01.target.local:1433 TARGETDOMAIN\\svc_sql
  setspn -S MSSQLSvc/sqlserver01.target.local TARGETDOMAIN\\svc_sql
  setspn -S MSSQLSvc/sqlserver01:1433 TARGETDOMAIN\\svc_sql

Step 8: Update SQL Server service to run as new account
  - Use SQL Server Configuration Manager (NOT services.msc - it handles permissions)
  - Change account for: SQL Server, SQL Agent, SSRS, SSIS

Step 9: Create new Windows logins for target domain
  -- For each user:
  CREATE LOGIN [TARGETDOMAIN\\jsmith] FROM WINDOWS
  -- For each group:
  CREATE LOGIN [TARGETDOMAIN\\GRP-App-Users] FROM WINDOWS

Step 10: Re-map database users to new logins
  USE [AppDatabase]
  ALTER USER [jsmith] WITH LOGIN = [TARGETDOMAIN\\jsmith]

  -- If the user name doesn't match, you may need:
  -- DROP USER [SOURCEDOMAIN\\jsmith]
  -- CREATE USER [jsmith] FOR LOGIN [TARGETDOMAIN\\jsmith]
  -- Then re-grant all permissions

Step 11: Transfer permissions (if user was recreated)
  -- Check current permissions first:
  USE [AppDatabase]
  SELECT dp.name, dp.type_desc, p.permission_name, p.state_desc
  FROM sys.database_permissions p
  JOIN sys.database_principals dp ON p.grantee_principal_id = dp.principal_id
  WHERE dp.name = 'jsmith'

  -- Re-grant as needed:
  GRANT SELECT, INSERT, UPDATE ON SCHEMA::dbo TO [jsmith]
  -- Or add to role:
  ALTER ROLE db_datareader ADD MEMBER [jsmith]</pre>

<pre>AFTER MIGRATION (Validation):

Step 12: Test connectivity from application
  - Can the app connect to SQL with the new domain credentials?
  - Check: SQL Server error log for login failures
  - Check: Application logs for connection errors

Step 13: Verify Kerberos (not falling back to NTLM)
  -- Run on client machine connecting to SQL:
  klist    (shows Kerberos tickets, should see MSSQLSvc/server:port)

  -- On SQL Server, check connection auth:
  SELECT session_id, auth_scheme FROM sys.dm_exec_connections
  -- Should show "KERBEROS" not "NTLM"

Step 14: Disable old logins (don't delete yet)
  ALTER LOGIN [SOURCEDOMAIN\\jsmith] DISABLE

Step 15: Monitor for 2 weeks, then remove old logins
  DROP LOGIN [SOURCEDOMAIN\\jsmith]</pre>

<h4>Linked servers (don't forget these)</h4>
<pre>If SQL Server has linked servers to other SQL instances:
  - The linked server may use SOURCEDOMAIN credentials for the connection
  - Check: SSMS > Server Objects > Linked Servers > Security
  - Update the remote login mapping to TARGETDOMAIN credentials

  EXEC sp_helplinkedsrvlogin    -- shows all linked server login mappings</pre>

<h4>Common SQL migration failures</h4>
<pre>"Login failed for SOURCEDOMAIN\\svc_app" - Service still using old account
"Cannot generate SSPI context"           - SPN missing or wrong on new account
"User or group not found"                - Login not yet created in target domain
"Orphaned users"                         - Database user exists but has no matching login
  Fix: ALTER USER [username] WITH LOGIN = [TARGETDOMAIN\\username]</pre>

<div class="interview-tip">Interview tip: "For SQL Server in a domain migration, I work through four layers: service account, server logins, database users, and database permissions. I script the discovery upfront - export all Windows logins and their database mappings. During cutover, I create the new logins, remap database users, and verify Kerberos with sys.dm_exec_connections. The most common post-migration issue is orphaned database users, which I fix with ALTER USER...WITH LOGIN."</div>
`
    },
    {
      id: 'adm-migration-runbook',
      title: 'Migration Runbook - How to Build and Execute One',
      content: `
<h4>What is a runbook</h4>
<p>A runbook is a step-by-step document that tells an engineer exactly what to do during a migration. Every step has: the action, the command or procedure, the expected result, the validation check, and the rollback step. No guessing, no improvisation. If step 7 fails, the runbook tells you what to do. Think of it as a pilot's pre-flight checklist - you follow it exactly, every time.</p>

<h4>Why runbooks matter in enterprise</h4>
<ul>
<li>Change Advisory Board (CAB) requires a documented plan before approving the change</li>
<li>Multiple engineers may execute different parts - runbook ensures consistency</li>
<li>3 AM cutover window with tired engineers - runbook prevents mistakes</li>
<li>Audit trail - "we followed the approved procedure"</li>
<li>Rollback plan - if something fails at step 12, you know exactly how to undo steps 1-11</li>
</ul>

<h4>Runbook structure (template)</h4>
<pre>=========================================
MIGRATION RUNBOOK: [Application Name]
=========================================
Migration ID:     MIG-2026-042
Application:      ERP System (SAP)
Server(s):        APP-SRV01, SQL-SRV01
Migration Date:   2026-06-15 02:00 - 06:00 (maintenance window)
Migration Lead:   Thinh Le
Approver:         Jay (CAB approved 2026-06-10)
Change Ticket:    CHG-2026-1234

PARTICIPANTS:
  - Migration Engineer: Thinh Le (identity, services)
  - DBA: [Name] (SQL migration steps)
  - App Owner: [Name] (UAT validation)
  - Network: [Name] (on-call for DNS/firewall)

PRE-REQUISITES (completed before migration window):
  [x] Target domain accounts created (TARGETDOMAIN\\svc_erp)
  [x] SPNs registered on new accounts
  [x] New AD groups created with correct membership
  [x] DNS records prepared (not yet active)
  [x] Rollback plan reviewed and approved
  [x] Backups verified: SQL full backup, system state backup
  [x] Communication sent to users about downtime

GO/NO-GO CHECKLIST (confirm at start of window):
  [ ] All team members present and confirmed
  [ ] Backups completed within last 4 hours
  [ ] No active incidents affecting target systems
  [ ] Change ticket status: In Progress
=========================================</pre>

<h4>Runbook step format</h4>
<pre>STEP [#] - [Action Name]
  Time estimate: [X minutes]
  Executed by:   [Role/Name]

  ACTION:
    [Exact command or procedure]

  EXPECTED RESULT:
    [What you should see if it worked]

  VALIDATION:
    [Command or check to verify]

  ROLLBACK (if this step fails):
    [Exact command to undo this step]

  STATUS: [ ] Not started  [ ] Complete  [ ] Failed - see notes

      id: 'adm-change-management',
      title: 'Change Management & ITIL Process',
      content: `
<h4>What it is</h4>
<p>Change management is the formal process that controls how changes are made to production systems. In an enterprise, you cannot just migrate an application because you feel like it. Every change goes through a defined process with approvals, risk assessment, and communication. This protects the business from unplanned outages.</p>

<h4>ITIL change management process</h4>
<pre>ITIL = Information Technology Infrastructure Library
  A set of best practices for IT service management.
  You don't need to memorize the entire framework.
  You need to understand the change management process.

THE FLOW:
  1. RFC (Request for Change)
     "I want to migrate the ERP application to the target domain"
     Includes: what, why, when, risk, rollback plan

  2. CHANGE ASSESSMENT
     Impact: What could break? Who is affected?
     Risk: High/Medium/Low based on complexity and blast radius
     Category:
       - Standard: pre-approved, low risk (e.g., add a user to a group)
       - Normal: requires CAB approval (e.g., migrate an application)
       - Emergency: expedited approval for critical fixes

  3. CAB REVIEW (Change Advisory Board)
     A meeting (usually weekly) where IT leadership reviews Normal changes.
     They ask: Is the plan solid? Is the rollback plan tested? Is the maintenance
     window appropriate? Are the right people involved?
     Outcome: Approved, Rejected, or Deferred

  4. SCHEDULED & COMMUNICATED
     Once approved, the change is scheduled in the maintenance calendar.
     Affected users are notified of downtime.
     All participants confirm availability.

  5. IMPLEMENTATION
     Execute the runbook during the approved window.
     Update the change ticket with progress.

  6. POST-IMPLEMENTATION REVIEW (PIR)
     Was it successful? Any issues? Lessons learned?
     Close the change ticket.</pre>

<h4>Change ticket fields (what you fill out)</h4>
<pre>Field                  Example
Change ID              CHG-2026-1234
Title                  Migrate ERP to target domain
Description            Migrate ERP app identity from SOURCEDOMAIN to TARGETDOMAIN
Requestor              Thinh Le
Change Type            Normal
Risk Level             High (business-critical application)
Impact                 150 users cannot access ERP during 4-hour window
Category               Application Migration
Environment            Production
Planned Start          2026-06-15 02:00 CST
Planned End            2026-06-15 06:00 CST
Rollback Deadline      2026-06-15 05:00 CST (1 hour before window ends)
Rollback Plan          Restore SQL backup, revert service accounts, restart services
Implementation Plan    See attached runbook (MIG-2026-042)
Test Plan              See attached UAT checklist
Communication Plan     Email to ERP users 5 days and 1 day before
Approvers              Jay (IT Director), App Owner</pre>

<h4>Release management for multi-wave migrations</h4>
<pre>A domain migration isn't one change - it's a program of 50+ changes.

RELEASE STRUCTURE:
  Release: "Domain Migration - Q3 2026"
    Wave 1: IT Department (10 users, 3 apps)     - Week 1
    Wave 2: Finance (30 users, 5 apps)           - Week 3
    Wave 3: Operations (80 users, 8 apps)        - Week 5
    Wave 4: Engineering (60 users, 12 apps)       - Week 7
    Wave 5: Remaining (120 users, 15 apps)        - Week 9
    Wave 6: Cleanup and decommission              - Week 11

Each wave has its own set of change tickets.
Each app within a wave has its own runbook.
Each wave has a go/no-go gate before proceeding to the next.</pre>

<h4>Incident management (when things break)</h4>
<pre>If a migration causes an issue after cutover:

Priority levels:
  P1 - Critical: Business stopped. ERP down for all users.
       Response: 15 minutes. All hands on deck. Execute rollback.
  P2 - High: Major feature broken. Reports not working.
       Response: 30 minutes. Investigate, fix or workaround.
  P3 - Medium: Minor feature broken. One user can't print.
       Response: 4 hours. Fix during business hours.
  P4 - Low: Cosmetic or non-urgent. Old domain name in footer.
       Response: Next business day.

POST-MIGRATION INCIDENT PROCESS:
  1. User reports issue -> Help desk creates incident ticket
  2. Triage: Is this migration-related? Check recent changes.
  3. If yes: escalate to migration team with change ticket reference
  4. Fix forward if possible, or rollback if within rollback window
  5. Document in both incident ticket and change ticket
  6. Add to "lessons learned" for next wave</pre>

<div class="interview-tip">Interview tip: "I'm experienced with formal change management. Every migration has an RFC with risk assessment, CAB approval, a documented runbook, and a rollback deadline. During multi-wave migrations, I treat each wave as a separate release with its own go/no-go gate. If Wave 1 reveals issues, we pause, remediate the process, and adjust the runbook before Wave 2."</div>
`

      title: 'Pre-Migration & Post-Migration Validation',
      content: `
<h4>What it is</h4>
<p>Validation is the proof that the migration worked. Pre-migration validation captures the "before" state. Post-migration validation proves the "after" state matches expectations. Without validation, you're guessing. With validation, you have evidence.</p>

<h4>Pre-migration validation checklist</h4>
<pre>RUN THESE BEFORE THE MIGRATION WINDOW OPENS:

IDENTITY CHECKS:
  [ ] Target domain accounts exist and are enabled
      Get-ADUser -Identity svc_appname -Server targetdc.target.local
  [ ] Target groups exist with correct membership
      Get-ADGroupMember -Identity "GRP-App-Users" -Server targetdc.target.local
  [ ] SPNs registered on target accounts
      setspn -L TARGETDOMAIN\\svc_appname
  [ ] No duplicate SPNs exist
      setspn -X    (forest-wide duplicate check)

NETWORK CHECKS:
  [ ] Server can reach target domain controllers
      Test-Connection targetdc.target.local
      Test-NetConnection targetdc.target.local -Port 389   (LDAP)
      Test-NetConnection targetdc.target.local -Port 88    (Kerberos)
  [ ] DNS resolution works for target domain
      Resolve-DnsName target.local
      Resolve-DnsName targetdc.target.local

BACKUP CHECKS:
  [ ] Full SQL backup completed and verified
      RESTORE VERIFYONLY FROM DISK = 'path\\backup.bak' WITH CHECKSUM
  [ ] System state backup completed
  [ ] Application config files backed up
      Copy-Item "C:\\App\\config" "C:\\Backups\\PreMigration\\" -Recurse
  [ ] Current service account configurations documented
      Get-WmiObject Win32_Service -ComputerName SERVER01 |
      Where { $_.StartName -like "SOURCEDOMAIN*" } |
      Export-Csv "PreMig_Services.csv" -NoTypeInformation

APPLICATION STATE CAPTURE:
  [ ] Application is currently functional (baseline test)
  [ ] Capture current performance metrics (response time, error rate)
  [ ] Document current connection count
      -- SQL: SELECT COUNT(*) FROM sys.dm_exec_connections
  [ ] Screenshot key dashboards / application state</pre>

<h4>Post-migration validation checklist</h4>
<pre>RUN THESE IMMEDIATELY AFTER MIGRATION STEPS COMPLETE:

IDENTITY VALIDATION:
  [ ] Services running under new domain account
      Get-WmiObject Win32_Service -ComputerName SERVER01 |
      Where { $_.Name -eq "AppService" } | Select Name, StartName, State
      # Expected: TARGETDOMAIN\\svc_app, Running

  [ ] Scheduled tasks running under new account
      Get-ScheduledTask -ComputerName SERVER01 |
      Where { $_.Principal.UserId -like "TARGETDOMAIN*" } |
      Select TaskName, @{N='RunAs';E={$_.Principal.UserId}}, State

  [ ] Kerberos working (not falling back to NTLM)
      # On SQL Server:
      SELECT session_id, auth_scheme, client_net_address
      FROM sys.dm_exec_connections WHERE auth_scheme = 'KERBEROS'
      # Should see KERBEROS connections

  [ ] SID History populated (if applicable)
      Get-ADUser svc_appname -Properties SIDHistory -Server targetdc.target.local |
      Select Name, SIDHistory

SQL VALIDATION:
  [ ] SQL Server service running
      Get-Service MSSQLSERVER -ComputerName SQL-SRV01
  [ ] SQL Agent running
      Get-Service SQLSERVERAGENT -ComputerName SQL-SRV01
  [ ] New logins exist and can connect
      -- Test from app server:
      sqlcmd -S SQL-SRV01 -E -Q "SELECT SUSER_NAME(), auth_scheme FROM sys.dm_exec_connections WHERE session_id = @@SPID"
  [ ] No orphaned users
      USE [AppDatabase]
      EXEC sp_change_users_login 'Report'
      # Should return 0 rows
  [ ] Database accessible and data intact
      SELECT COUNT(*) FROM [critical_table]
      # Compare with pre-migration count

APPLICATION VALIDATION:
  [ ] Application starts without errors
  [ ] Users can log in with target domain credentials
  [ ] Core functionality test:
      [ ] Read operation (view existing data)
      [ ] Write operation (create new record)
      [ ] Report generation
      [ ] Search functionality
  [ ] No errors in application logs
      Get-EventLog -ComputerName APP-SRV01 -LogName Application -After (Get-Date).AddHours(-1) -EntryType Error
  [ ] Performance acceptable (compare to pre-migration baseline)

NETWORK VALIDATION:
  [ ] DNS resolves correctly
  [ ] No firewall blocks on new paths
  [ ] Certificates valid (if using SSL/TLS with new domain names)</pre>

<h4>UAT (User Acceptance Testing)</h4>
<pre>WHO: The application owner or a designated business user
WHEN: After engineering validation passes
WHY: Engineers verify technical function. Users verify business function.

UAT TEST PLAN (template):
  Application: [Name]
  Tested by: [Name]
  Date: [Date]
  Domain: TARGETDOMAIN

  Test Case 1: Login
    Action: Open application, log in with TARGETDOMAIN\\username
    Expected: Successful login, home screen displays
    Result: [ ] Pass  [ ] Fail
    Notes: ________________________________

  Test Case 2: View existing data
    Action: Open record #12345
    Expected: Record displays with correct data
    Result: [ ] Pass  [ ] Fail
    Notes: ________________________________

  Test Case 3: Create new data
    Action: Create new record with test data
    Expected: Record saves successfully
    Result: [ ] Pass  [ ] Fail
    Notes: ________________________________

  Test Case 4: Generate report
    Action: Run [Monthly Summary] report
    Expected: Report generates with correct data
    Result: [ ] Pass  [ ] Fail
    Notes: ________________________________

  SIGN-OFF:
  [ ] All test cases passed
  [ ] Application owner approves migration
  Signature: _________________ Date: _________</pre>

<h4>Hyper-care period</h4>
<pre>WHAT: A period of elevated monitoring and support after migration (typically 1-2 weeks).
WHY: Issues may not surface immediately - some run on weekly schedules, month-end processes.

HYPER-CARE ACTIVITIES:
  Day 1-3:  Migration team actively monitors, responds within 15 min
  Day 4-7:  Normal support resumes, migration team on-call
  Day 8-14: Monitor for edge cases (month-end reports, scheduled jobs)
  Day 15:   Hyper-care ends, transition to BAU (business as usual)

WHAT TO WATCH:
  - Failed scheduled tasks (they run on schedules you may not know about)
  - Authentication failures in event logs
  - Application errors spiking
  - User-reported issues ("it worked before the migration")
  - Performance degradation</pre>

<div class="interview-tip">Interview tip: "I run validation in three phases. Pre-migration captures the baseline and confirms readiness. Post-migration validates technical function - services running, Kerberos working, no orphaned SQL users. Then UAT validates business function with the app owner. After sign-off, I maintain hyper-care for two weeks. I've seen issues surface 10 days later when a monthly batch job runs for the first time post-migration."</div>
`

      id: 'adm-server-app-migration',
      title: 'Server Application Migration Patterns',
      content: `
<h4>What it is</h4>
<p>When the JD says "on-premise to on-premise application migrations for servers," it means taking an application running on a server joined to the source domain and making it work in the target domain. There are three approaches, and you choose based on risk, complexity, and downtime tolerance.</p>

<h4>Migration approach 1: IN-PLACE REMEDIATION (most common)</h4>
<pre>WHAT: Keep the app on the same server. Update identity bindings.
      Server gets re-joined to target domain.

WHEN TO USE:
  - App is tightly coupled to the server (installed, configured, data local)
  - Rebuild would take too long or is too risky
  - Downtime window is short

STEPS:
  1. Pre-migration: Document all identity bindings (service accounts, SPNs, etc.)
  2. Create target domain accounts and groups
  3. During window: Update service accounts to target domain
  4. Update scheduled tasks
  5. Update IIS app pools (if applicable)
  6. Update config files with target domain references
  7. Re-join server to target domain (requires reboot)
      # Unjoin from source:
      Remove-Computer -UnjoinDomainCredential SOURCEDOMAIN\\admin -Force
      # Join to target:
      Add-Computer -DomainName target.local -Credential TARGETDOMAIN\\admin -Restart
  8. Verify services start under new accounts
  9. Run validation

RISK: Medium - lots of moving parts on a live server
DOWNTIME: 1-4 hours typically</pre>

<h4>Migration approach 2: CLONE/REBUILD (cleanest)</h4>
<pre>WHAT: Build a new server in target domain, install app fresh,
      migrate data from old to new.

WHEN TO USE:
  - App is simple to install
  - Server OS needs upgrading anyway
  - You want a clean state (no legacy cruft)
  - Higher downtime tolerance

STEPS:
  1. Build new server, join to target domain
  2. Install application on new server
  3. Configure with target domain accounts
  4. Migrate data (database restore, file copy, etc.)
  5. Update DNS to point to new server
  6. Validate
  7. Keep old server as rollback for 2 weeks

RISK: Low (clean build) but high effort
DOWNTIME: 2-8 hours (data migration dependent)</pre>

<h4>Migration approach 3: SWING MIGRATION</h4>
<pre>WHAT: Use a temporary intermediate server to minimize downtime.
      Old server -> copy to temp -> cutover -> copy to new.

WHEN TO USE:
  - Zero-downtime requirement
  - Database replication available (SQL Always On, log shipping)
  - Complex application that needs parallel running

STEPS:
  1. Set up SQL log shipping from old to new
  2. Install app on new server (target domain)
  3. Cutover: stop log shipping, bring new DB online
  4. Update DNS to point to new server
  5. Old server becomes rollback

RISK: Low downtime, high complexity
DOWNTIME: Minutes (DNS TTL dependent)</pre>

<h4>Server domain re-join (the mechanics)</h4>
<pre>When you re-join a server to a new domain, understand what happens:

1. Computer account is removed from source domain
2. Computer account is created in target domain
3. Server reboots
4. Server establishes secure channel with target DC
5. Computer gets new SID
6. Local group memberships referencing SOURCEDOMAIN are BROKEN
   - "SOURCEDOMAIN\\Domain Admins" was in local Administrators -> GONE
   - You must pre-add TARGETDOMAIN\\Domain Admins to local Administrators BEFORE re-join
   - Otherwise you lock yourself out

PRE-RE-JOIN CHECKLIST:
  [ ] Add TARGETDOMAIN\\Domain Admins to local Administrators group
      net localgroup Administrators TARGETDOMAIN\\Domain Admins /add
  [ ] Add TARGETDOMAIN service accounts to required local groups
  [ ] Document all local group memberships referencing source domain
      Get-LocalGroupMember -Group "Administrators"
      Get-LocalGroupMember -Group "Remote Desktop Users"
  [ ] Ensure target DC is reachable (ports 88, 389, 445, 135, 464)
  [ ] Have local admin credentials as backup (in case domain join fails)</pre>

<h4>Application types and their special considerations</h4>
<pre>IIS WEB APPLICATIONS:
  - App pool identity (change to target domain)
  - Web.config connection strings (update domain references)
  - Windows authentication settings (allow target domain)
  - SSL certificates (may reference old domain in SAN)
  - Service account for app pool needs "Log on as a service" right

FILE SERVERS:
  - Share permissions reference source domain SIDs
  - NTFS permissions reference source domain SIDs
  - Quest or ADMT can re-ACL permissions to target domain SIDs
  - DFS namespaces may need updating

PRINT SERVERS:
  - Printer permissions reference source domain groups
  - Print drivers may need re-deployment
  - GPO printer mappings need updating

CERTIFICATE AUTHORITY:
  - If source domain has AD Certificate Services, this is COMPLEX
  - Certificates issued reference source domain in templates
  - May need to migrate CA or build new one in target domain
  - All certificates may need re-issuance

MONITORING AGENTS (SCOM, Zabbix, etc.):
  - Service account for monitoring agent
  - May need re-registration with management server
  - Alert thresholds may need updating for migration noise</pre>

<div class="interview-tip">Interview tip: "I classify every application into one of three migration approaches: in-place remediation for complex apps that can't be rebuilt easily, clone/rebuild for simpler apps where we want a clean state, or swing migration for zero-downtime requirements using SQL log shipping. The decision depends on downtime tolerance, application complexity, and whether the server OS needs upgrading anyway."</div>
`
    },
    {
      id: 'adm-dns-certificates',
      title: 'DNS, Certificates & Network Identity in Migration',
      content: `
<h4>DNS in a domain migration</h4>
<p>DNS is the phonebook of your network. Every server, every application URL, every domain controller - all found via DNS. When you migrate domains, DNS gets complicated because the old domain name doesn't just disappear. Applications, scripts, bookmarks, and muscle memory all reference the old names.</p>

<h4>DNS zones you're dealing with</h4>
<pre>SOURCE DOMAIN DNS:
  source.local (AD-integrated zone)
    - DC records: dc01.source.local, dc02.source.local
    - Server records: sqlserver01.source.local, appserver01.source.local
    - SRV records: _ldap._tcp.source.local (how clients find DCs)
    - Application CNAMEs: erp.source.local -> appserver01.source.local

TARGET DOMAIN DNS:
  target.local (AD-integrated zone)
    - New DC records: dc01.target.local, dc02.target.local
    - New server records: (created as servers join target domain)
    - SRV records: _ldap._tcp.target.local
    - Application CNAMEs: need to create these</pre>

<h4>DNS migration strategy</h4>
<pre>OPTION 1: CNAME BRIDGE (recommended during coexistence)
  Keep old DNS names working by pointing them to new locations.
  erp.source.local -> CNAME -> erp.target.local -> A record -> 10.0.1.50
  This way, anything still using the old name still works.

OPTION 2: CONDITIONAL FORWARDERS
  Source DNS forwards queries for target.local to target DCs.
  Target DNS forwards queries for source.local to source DCs.
  Both domains can resolve each other.

OPTION 3: STUB ZONES
  Source DNS holds a copy of target.local NS records.
  Lighter than conditional forwarder, auto-updates.

DURING MIGRATION:
  Phase 1: Set up conditional forwarders both directions
  Phase 2: As servers migrate, update DNS records
  Phase 3: Create CNAMEs from old names to new names
  Phase 4: After decommission, keep CNAMEs for 6 months
  Phase 5: Remove old DNS zone</pre>

<h4>DNS records to update per server</h4>
<pre>WHEN A SERVER MIGRATES TO TARGET DOMAIN:
  1. New A record created automatically: server01.target.local
  2. Old A record still exists: server01.source.local (points to same IP)
  3. Create CNAME: server01.source.local -> server01.target.local
     (only if old A record is removed)
  4. Or: keep both A records during coexistence (both resolve)
  5. Update application CNAMEs to point to new name
  6. Reduce TTL before migration (300 seconds = 5 min, so changes propagate fast)

CRITICAL: Reduce DNS TTL to 300 seconds 24-48 hours BEFORE the migration window.
Default TTL is often 3600 (1 hour). If something goes wrong, you don't want to
wait an hour for DNS to update during rollback.</pre>

<h4>Certificates in a domain migration</h4>
<pre>WHY CERTIFICATES BREAK:
  Certificates contain the server's identity in the Subject and SAN fields.
  Example: CN=erp.source.local, SAN=erp.source.local
  If the server moves to target.local and clients access it via erp.target.local,
  the certificate is for the wrong name -> browser/app shows certificate error.

CERTIFICATE SCENARIOS:

Scenario 1: Server keeps old DNS name (via CNAME)
  Certificate still valid. No action needed.
  erp.source.local CNAME -> erp.target.local -> cert is for erp.source.local -> matches

Scenario 2: Server gets new DNS name
  Need new certificate with new name.
  Request cert: CN=erp.target.local, SAN=erp.target.local, erp.source.local
  Including old name in SAN handles both during transition.

Scenario 3: Internal CA (AD Certificate Services) on source domain
  Templates reference source domain
  Auto-enrollment uses source domain policies
  Options:
    a) Build new CA in target domain (recommended for inter-forest)
    b) Migrate CA (complex, Microsoft has documentation)
    c) Use public CA (Let's Encrypt, DigiCert) - simpler, no AD dependency

CERTIFICATE CHECKLIST PER APPLICATION:
  [ ] What certificate is installed? (thumbprint, CN, SAN, expiry)
      Get-ChildItem Cert:\\LocalMachine\\My | Select Subject, Thumbprint, NotAfter
  [ ] Does the certificate name match the new DNS name?
  [ ] If not: request new certificate
  [ ] If using auto-enrollment: configure in target domain CA
  [ ] Update application binding to use new certificate
      # IIS example:
      netsh http show sslcert    (shows current binding)
      # Update in IIS Manager > Site > Bindings > Edit</pre>

<div class="interview-tip">Interview tip: "For DNS, I reduce TTL to 5 minutes 48 hours before migration so DNS changes propagate quickly during cutover. I set up conditional forwarders between domains for coexistence, and use CNAMEs from old names to new names so applications using the old DNS still resolve. For certificates, I request new certs with both old and new names in the SAN field to cover the transition period."</div>
`
    },
    {
      id: 'adm-computer-migration',
      title: 'Computer & Workstation Migration',
      content: `
<h4>What it is</h4>
<p>Every Windows computer in the source domain needs to be moved to the target domain. For 300+ workstations, this means a structured wave approach, not one-by-one. The computer gets a new domain membership, new GPOs apply, and the user logs in with target domain credentials.</p>

<h4>Computer migration methods</h4>
<pre>METHOD 1: QUEST MIGRATION MANAGER (recommended for scale)
  - Quest agent on workstation handles the re-join
  - Preserves local profiles (user doesn't lose desktop, files)
  - Can be scripted and scheduled
  - Handles local group membership update automatically
  - Requires reboot

METHOD 2: ADMT (Active Directory Migration Tool)
  - Free Microsoft tool
  - Computer Migration Wizard
  - Translates local profiles and permissions
  - Less automation than Quest
  - Requires ADMT agent installed on target DC

METHOD 3: MANUAL RE-JOIN
  - Remove from source domain, join to target domain
  - Simple but doesn't scale
  - Risk of profile loss if not handled correctly
  - Use for one-offs or troubleshooting

METHOD 4: WINDOWS AUTOPILOT RESET (modern approach)
  - If moving to cloud-managed (Intune) simultaneously
  - Wipes and re-provisions device
  - User gets fresh start
  - Only if acceptable to lose local state</pre>

<h4>Quest computer migration (step by step)</h4>
<pre>PRE-MIGRATION:
  1. User migration completed (user account exists in target domain)
  2. Target domain groups created with correct membership
  3. GPOs prepared in target domain
  4. Quest agent deployed to workstation (can be pushed via GPO or SCCM)

MIGRATION:
  5. Quest console: select computers for this wave
  6. Quest translates local profile:
     - SOURCEDOMAIN\\jsmith profile -> TARGETDOMAIN\\jsmith profile

  7. Quest updates local group memberships:
     - Removes SOURCEDOMAIN\\Domain Users from local Users group
     - Adds TARGETDOMAIN\\Domain Users
     - Same for any other local group references
  8. Quest re-joins computer to target domain
  9. Computer reboots

POST-MIGRATION:
  10. User logs in with TARGETDOMAIN\\jsmith (or jsmith@target.local)
  11. Target domain GPOs apply
  12. User profile loads with all their files and settings
  13. Validate: mapped drives, printers, applications all work</pre>

<h4>User profile preservation (critical)</h4>
<pre>THE PROBLEM:
  Windows profiles are stored as: C:\\Users\\SOURCEDOMAIN.jsmith\\
  When user logs in as TARGETDOMAIN\\jsmith, Windows creates NEW profile:
  C:\\Users\\TARGETDOMAIN.jsmith\\
  User loses: desktop icons, documents, favorites, app settings, Outlook profile

THE SOLUTION (what Quest does):
  Quest updates the profile registry keys to map the old profile to the new identity.
  HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\ProfileList\\
  The SID-keyed profile entry gets updated with the new SID.
  Result: User logs in with new domain credentials, gets their OLD profile.

MANUAL APPROACH (if not using Quest):
  1. Log in as local admin
  2. Join computer to target domain
  3. Reboot
  4. Before user logs in:
     - Note old profile SID in ProfileList registry
     - Log in as TARGETDOMAIN\\jsmith (creates new profile)
     - Log out
     - Copy contents of old profile folder to new profile folder
     - OR: Update registry to point new SID to old profile path
  5. This is error-prone at scale - use Quest</pre>

COMMON POST-MIGRATION ISSUES:

  - Outlook profile broken (new profile needed, or Quest handles it)
  - Application can't connect (still looking for source domain resources)
  - Cached credentials (user laptop was offline during migration -> credential conflict)</pre>

<h4>What is enterprise backup</h4>
<p>Backup tools create copies of your data and systems so you can recover from hardware failure, ransomware, accidental deletion, or failed migrations. In enterprise, backup is not optional - it's a compliance requirement. Every server, every database, every critical system has a backup schedule and a tested recovery plan.</p>

<h4>Key concepts</h4>
<pre>RPO (Recovery Point Objective):
  "How much data can we afford to lose?"
  RPO = 1 hour means backups run at least every hour.
  If disaster strikes, you lose at most 1 hour of data.

RTO (Recovery Time Objective):
  "How fast do we need to be back up?"
  RTO = 4 hours means you must restore service within 4 hours.

3-2-1 Rule:
  3 copies of data
  2 different media types (disk + tape, or disk + cloud)
  1 offsite copy (different location or cloud)

Backup types:
  Full   - everything, every time. Slowest, most storage, fastest restore.
  Incremental - only what changed since LAST backup. Fast, small, slower restore.
  Differential - only what changed since last FULL. Middle ground.</pre>

<h4>The tools</h4>
<pre>VEEAM (market leader for virtualization backup):
  What: Backup and replication for VMs, physical servers, cloud workloads, M365.
  Strength: VMware/Hyper-V integration is excellent. Fast restore. Easy to use.
  Key features:
    - Image-level backup (entire VM as a single file)
    - Instant VM Recovery (boot backup directly as VM in minutes)
    - SureBackup (automated backup verification - actually boots the backup and tests it)
    - Veeam ONE (monitoring and reporting for backup environment)
    - M365 backup (Exchange, SharePoint, Teams, OneDrive)
  Used by: Most enterprises with VMware or Hyper-V.
  Your role: Configure backup jobs, monitor success/failure, test restores.

RUBRIK (modern, API-first):
  What: Backup-as-a-service appliance. Drop it in, it manages itself.
  Strength: Immutable backups (ransomware can't encrypt them), API-driven, SLA-based.
  Key concept: You define an SLA ("Gold = backup every 4 hours, keep 30 days")
               and assign VMs/databases to SLAs. Rubrik handles the rest.
  Used by: Enterprises modernizing backup, security-conscious orgs.

COMMVAULT:
  What: Enterprise backup for everything (physical, virtual, cloud, SaaS, database).
  Strength: Broad coverage - if it exists, Commvault can back it up.
  Weakness: Complex to manage, steep learning curve.
  Used by: Large enterprises with diverse environments.

AZURE BACKUP:
  What: Microsoft's cloud backup service.
  Backs up: Azure VMs, on-prem VMs (via agent), SQL, file shares, M365 (limited).
  Strength: Native Azure integration, no infrastructure to manage.
  Key component: Recovery Services Vault (where backups are stored).
  Used by: Azure-heavy environments, hybrid setups.

WINDOWS SERVER BACKUP (built-in):
  What: Free, basic backup built into Windows Server.
  Use for: System state backup (AD, registry, boot files).

  Not suitable for: Enterprise-scale backup management.</pre>

<h4>Backup in migration context</h4>
<pre>BEFORE ANY MIGRATION:

  5. For servers: Full image backup or Veeam snapshot
  6. Document backup locations and restore procedures in runbook

IF MIGRATION FAILS:
  7. Restore SQL database from pre-migration backup
  8. Restore server from image backup if domain re-join failed
  9. System state restore if DC was affected (last resort)</pre>

<div class="interview-tip">Interview tip: "Before any migration, I verify backups are current and restorable - not just that the backup job says 'success.' I take a manual SQL backup with CHECKSUM before database changes, and a system state backup before domain operations. The backup is my rollback safety net."</div>

<h4>What is PAM</h4>
<p>Privileged Access Management (PAM) controls and monitors who uses admin accounts. In enterprise, you don't just "know the admin password." Admin credentials are stored in a vault, checked out when needed, automatically rotated, and every use is logged. This prevents insider threats and limits damage from compromised accounts.</p>

<h4>The problem PAM solves</h4>
<pre>WITHOUT PAM:
  - 15 engineers share the same Domain Admin password
  - Password is in a spreadsheet or someone's head
  - Password hasn't been changed in 2 years
  - No audit trail of who used it when
  - If one engineer is compromised, attacker has Domain Admin
  - Service account passwords are hard-coded in scripts

WITH PAM:
  - Admin credentials stored in encrypted vault
  - Engineer requests access, gets temporary credential
  - Session is recorded (video replay of what they did)
  - Password auto-rotates after use
  - Full audit trail: who, when, what, from where
  - Service accounts managed and rotated automatically</pre>

<h4>The tools</h4>

  What: Full PAM suite - vault, session management, password rotation.
  Components:
    - Digital Vault: encrypted storage for credentials
    - PSM (Privileged Session Manager): proxies and records admin sessions
    - CPM (Central Policy Manager): auto-rotates passwords on schedule
    - PTA (Privileged Threat Analytics): detects anomalous privileged activity
    - AAM (Application Access Manager): manages credentials for applications

    2. Open CyberArk portal, find the server
    3. Click "Connect" - CyberArk retrieves the password from the vault
    4. PSM opens an RDP session (you never see the actual password)
    5. Your session is recorded
    6. After you disconnect, the password may auto-rotate

BEYONDTRUST (strong in endpoint privilege):

<h4>What is SIEM</h4>
<p>Security Information and Event Management (SIEM) collects logs from every system, correlates them, and detects threats. Think of it as a security camera system for your entire IT environment - every login, every file access, every network connection is logged, and the SIEM watches for suspicious patterns.</p>

  Components:
    - Forwarders: collect logs from servers/devices
    - Indexers: store and index the data
    - Search Heads: where you query and build dashboards
    - Splunk Enterprise Security (ES): SIEM add-on with correlation rules
  Used by: Large enterprises, security-heavy orgs.
  Cost: Expensive (licensed by daily data ingestion volume).

MICROSOFT SENTINEL (cloud SIEM):
  What: Cloud-native SIEM built on Azure Log Analytics.
  Strength: Native integration with M365, Entra ID, Azure, Defender.
  Query language: KQL (Kusto Query Language) - same as Azure Monitor.
  Key features:
    - Data connectors: plug in any log source (M365, firewalls, servers)

    - Playbooks: automated response (Logic Apps)
    - Workbooks: dashboards and reports
    - UEBA: user and entity behavior analytics
  Used by: Microsoft-heavy environments, cloud-forward orgs.

IBM QRADAR:
  What: Enterprise SIEM with strong correlation engine.
  Strength: Offense detection, network flow analysis.
  Used by: Government, financial services, traditional enterprise.
  Know it exists, less common in new deployments.

CROWDSTRIKE FALCON (EDR/XDR, not pure SIEM):

MICROSOFT DEFENDER FOR ENDPOINT (EDR):
  What: Microsoft's EDR product. Competes with CrowdStrike.

<h4>What is enterprise patch management</h4>
<p>Patch management is the process of testing, approving, and deploying software updates (security patches, bug fixes, feature updates) across your environment. Microsoft releases patches on the second Tuesday of every month ("Patch Tuesday"). Unpatched systems are the #1 attack vector for ransomware.</p>

<h4>The tools</h4>

  What: Free Microsoft tool for managing Windows updates.
  How: WSUS server downloads updates from Microsoft, admins approve,

  Strength: Patch + deploy + compliance reporting in one tool.
  Features:

    - Maintenance Windows (deploy only during approved times)
    - Automatic Deployment Rules (auto-approve and deploy monthly)
    - Compliance reporting (which servers are missing patches)
  Used by: Enterprises with SCCM already deployed.

AZURE UPDATE MANAGER:

  Used by: Azure and hybrid environments.

INTUNE WINDOWS UPDATE FOR BUSINESS:

    - Feature update deferrals (delay major updates by X days)

  Used by: Intune-managed devices (modern management).
